<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Farm Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0f;
    color: #e8e8e6;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  .container {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    color: #e8e8e6;
    letter-spacing: -0.02em;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 99px;
    background: #1e1e22;
    color: #888;
    border: 0.5px solid #2a2a2e;
    margin-bottom: 0.25rem;
  }

  .badge.active { background: #0f2a1a; color: #4ade80; border-color: #166534; }
  .badge.active::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; display: inline-block; }
  .badge.idle::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #888; display: inline-block; }

  .card {
    background: #141416;
    border: 0.5px solid #242428;
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #666;
  }

  label {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 4px;
    display: block;
  }

  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    background: #0d0d0f;
    border: 0.5px solid #2a2a2e;
    border-radius: 8px;
    color: #e8e8e6;
    font-size: 13px;
    padding: 9px 12px;
    font-family: 'Courier New', monospace;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
    border-color: #4ade80;
  }

  select option { background: #141416; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    width: 100%;
  }

  .btn-start {
    background: #166534;
    color: #4ade80;
    border: 0.5px solid #166534;
  }
  .btn-start:hover { background: #15803d; }

  .btn-stop {
    background: #3b0a0a;
    color: #f87171;
    border: 0.5px solid #7f1d1d;
  }
  .btn-stop:hover { background: #7f1d1d; }

  .btn-disabled {
    background: #1a1a1e;
    color: #555;
    border: 0.5px solid #2a2a2e;
    cursor: not-allowed;
  }

  .log-box {
    background: #0a0a0c;
    border: 0.5px solid #1e1e22;
    border-radius: 10px;
    padding: 1rem;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.6;
    color: #888;
    height: 280px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .log-box .ok { color: #4ade80; }
  .log-box .err { color: #f87171; }
  .log-box .info { color: #60a5fa; }
  .log-box .skip { color: #facc15; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .stat {
    background: #0d0d0f;
    border: 0.5px solid #1e1e22;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }

  .stat .val { font-size: 22px; font-weight: 700; color: #e8e8e6; }
  .stat .lbl { font-size: 11px; color: #555; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

  .stat.green .val { color: #4ade80; }
  .stat.red .val { color: #f87171; }
  .stat.blue .val { color: #60a5fa; }

  .toggle-eye {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #555;
    font-size: 13px;
    user-select: none;
  }

  .input-wrap { position: relative; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 4px; }

  .row-action { display: flex; gap: 10px; align-items: flex-end; }
  .row-action > .btn { flex: 1; }

  .divider { border: none; border-top: 0.5px solid #1e1e22; }

  .clear-btn {
    font-size: 11px;
    color: #555;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-family: inherit;
  }
  .clear-btn:hover { color: #888; }

  .log-header { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<div class="container">

  <div>
    <div class="badge idle" id="badgeEl">idle</div>
    <h1>Coin Farm Bot</h1>
  </div>

  <!-- AUTH CARD -->
  <div class="card">
    <div class="card-title">Authentication</div>
    <div>
      <label>X-Authorization (session ticket)</label>
      <div class="input-wrap">
        <input type="password" id="authToken" placeholder="Paste your PlayFab session ticket..." />
        <span class="toggle-eye" onclick="toggleAuth()">👁</span>
      </div>
    </div>
    <div>
      <label>Title ID</label>
      <input type="text" id="titleId" value="bdff1" />
    </div>
    <div>
      <label>Player ID <span style="color:#555;font-size:11px;">(auto-resolved from token)</span></label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="resolvedPlayerId" placeholder="Paste token then click Resolve →" readonly style="flex:1;color:#4ade80;" />
        <button onclick="fetchPlayerId()" style="white-space:nowrap;padding:9px 14px;background:#1a2a1a;border:0.5px solid #166534;color:#4ade80;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Courier New',monospace;">Resolve</button>
      </div>
    </div>
  </div>

  <!-- MATCH CONFIG -->
  <div class="card">
    <div class="card-title">Match Config</div>
    <div class="grid2">
      <div>
        <label>Room type</label>
        <input type="text" id="roomType" value="Normal" />
      </div>
      <div>
        <label>Cycle interval</label>
        <select id="delaySelect">
          <option value="1">1 minute</option>
          <option value="3">3 minutes</option>
          <option value="5" selected>5 minutes</option>
          <option value="10">10 minutes</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
        </select>
      </div>
    </div>
    <div>
      <label>Player IDs (leave blank to skip)</label>
      <div class="grid3">
        <input type="text" id="p1" placeholder="Player 1" />
        <input type="text" id="p2" placeholder="Player 2" />
        <input type="text" id="p3" placeholder="Player 3" />
        <input type="text" id="p4" placeholder="Player 4" />
        <input type="text" id="p5" placeholder="Player 5" />
        <input type="text" id="p6" placeholder="Player 6" />
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stat-row">
    <div class="stat green"><div class="val" id="statOk">0</div><div class="lbl">Cycles ok</div></div>
    <div class="stat red"><div class="val" id="statErr">0</div><div class="lbl">Errors</div></div>
    <div class="stat blue"><div class="val" id="statTotal">0</div><div class="lbl">API calls</div></div>
  </div>

  <!-- CONTROLS -->
  <button class="btn btn-start" id="mainBtn" onclick="toggleBot()">▶ Start bot</button>

  <!-- LOG -->
  <div class="card" style="gap: 0.75rem;">
    <div class="log-header">
      <div class="card-title">Live log</div>
      <button class="clear-btn" onclick="clearLog()">clear</button>
    </div>
    <div class="log-box" id="logBox">Waiting to start...\n</div>
  </div>

</div>

<script>
let running = false;
let intervalId = null;
let cyclesOk = 0;
let cyclesErr = 0;
let totalCalls = 0;

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('titleId').value = 'bdff1';
});

function toggleAuth() {
  const el = document.getElementById('authToken');
  el.type = el.type === 'password' ? 'text' : 'password';
}

async function fetchPlayerId() {
  const token = document.getElementById('authToken').value.trim();
  const titleId = document.getElementById('titleId').value.trim();
  const outEl = document.getElementById('resolvedPlayerId');

  if (!token) { outEl.value = 'Paste your X-Authorization token first'; outEl.style.color='#f87171'; return; }
  if (!titleId) { outEl.value = 'Title ID missing'; outEl.style.color='#f87171'; return; }

  outEl.value = 'Resolving...';
  outEl.style.color = '#facc15';

  try {
    const res = await fetch(`https://${titleId}.playfabapi.com/Client/GetAccountInfo`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Authorization': token },
      body: JSON.stringify({})
    });
    const data = await res.json();
    if (data.code >= 400) throw new Error(data.errorMessage || data.errorCode || 'Auth error');
    const pid = data?.data?.AccountInfo?.PlayFabId;
    if (!pid) throw new Error('PlayFabId not found in response');
    outEl.value = pid;
    outEl.style.color = '#4ade80';
    log(`  ✓ Player ID resolved: ${pid}`, 'ok');
  } catch(e) {
    outEl.value = 'Error: ' + e.message;
    outEl.style.color = '#f87171';
    log(`  ✗ fetchPlayerId: ${e.message}`, 'err');
  }
}

function log(msg, cls) {
  const box = document.getElementById('logBox');
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = msg + '\n';
  box.appendChild(span);
  box.scrollTop = box.scrollHeight;
}

function clearLog() {
  document.getElementById('logBox').innerHTML = '';
}

function setStats() {
  document.getElementById('statOk').textContent = cyclesOk;
  document.getElementById('statErr').textContent = cyclesErr;
  document.getElementById('statTotal').textContent = totalCalls;
}

function setBadge(active) {
  const b = document.getElementById('badgeEl');
  b.className = 'badge ' + (active ? 'active' : 'idle');
  b.textContent = active ? 'running' : 'idle';
}

async function apiCall(titleId, token, endpoint, body) {
  totalCalls++;
  setStats();
  const res = await fetch(`https://${titleId}.playfabapi.com/${endpoint}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Authorization': token
    },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok || data.code >= 400) throw new Error(data.errorMessage || data.errorCode || 'API error');
  return data;
}

async function runCycle() {
  const token = document.getElementById('authToken').value.trim();
  const titleId = document.getElementById('titleId').value.trim();
  const roomType = document.getElementById('roomType').value.trim() || 'Normal';
  const playerIds = ['p1','p2','p3','p4','p5','p6']
    .map(id => document.getElementById(id).value.trim())
    .filter(Boolean);

  if (!token || !titleId) {
    log('[!] Missing auth token or title ID — bot stopped.', 'err');
    stopBot();
    return;
  }

  const ts = new Date().toLocaleTimeString();
  log(`\n=== Cycle @ ${ts} | room=${roomType} | players=${playerIds.length} ===`, 'info');

  let matchId = null;
  let cycleOk = true;

  try {
    const d = await apiCall(titleId, token, 'Client/ExecuteCloudScript', {
      FunctionName: 'startNewMatch',
      FunctionParameter: { roomType, playerIds },
      GeneratePlayStreamEvent: true
    });
    matchId = d?.data?.FunctionResult?.currentMatchId ?? null;
    log(`  ✓ startNewMatch${matchId ? ' → matchId: ' + matchId : ''}`, 'ok');
  } catch(e) {
    log(`  ✗ startNewMatch: ${e.message}`, 'err');
    cycleOk = false;
  }

  try {
    await apiCall(titleId, token, 'Client/ExecuteCloudScript', {
      FunctionName: 'decideSpecialRole',
      FunctionParameter: { roomType, playerIds },
      GeneratePlayStreamEvent: true
    });
    log(`  ✓ decideSpecialRole`, 'ok');
  } catch(e) {
    log(`  ✗ decideSpecialRole: ${e.message}`, 'err');
    cycleOk = false;
  }

  if (matchId) {
    try {
      await apiCall(titleId, token, 'Client/ExecuteCloudScript', {
        FunctionName: 'xpConsumed',
        FunctionParameter: { token: matchId },
        GeneratePlayStreamEvent: true
      });
      log(`  ✓ xpConsumed`, 'ok');
    } catch(e) {
      log(`  ✗ xpConsumed: ${e.message}`, 'err');
      cycleOk = false;
    }
  } else {
    log(`  ⏩ xpConsumed skipped (no matchId)`, 'skip');
  }

  try {
    const d = await apiCall(titleId, token, 'Client/ExecuteCloudScript', {
      FunctionName: 'finishMatch',
      FunctionParameter: { roomType, playerIds },
      GeneratePlayStreamEvent: true
    });
    log(`  ✓ finishMatch`, 'ok');
    if (d?.data?.Logs?.length) {
      d.data.Logs.forEach(l => log(`    → ${l.Message}`, 'info'));
    }
  } catch(e) {
    log(`  ✗ finishMatch: ${e.message}`, 'err');
    cycleOk = false;
  }

  if (cycleOk) cyclesOk++; else cyclesErr++;
  setStats();

  const delay = parseInt(document.getElementById('delaySelect').value);
  log(`  ↻ next cycle in ${delay} min`, 'info');
}

function startBot() {
  running = true;
  const btn = document.getElementById('mainBtn');
  btn.className = 'btn btn-stop';
  btn.textContent = '■ Stop bot';
  setBadge(true);
  clearLog();
  log('Bot started.', 'info');
  runCycle();
  const delay = parseInt(document.getElementById('delaySelect').value) * 60 * 1000;
  intervalId = setInterval(runCycle, delay);
}

function stopBot() {
  running = false;
  if (intervalId) clearInterval(intervalId);
  intervalId = null;
  const btn = document.getElementById('mainBtn');
  btn.className = 'btn btn-start';
  btn.textContent = '▶ Start bot';
  setBadge(false);
  log('\nBot stopped.', 'info');
}

function toggleBot() {
  if (running) stopBot(); else startBot();
}
</script>
</body>
</html>
