<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Neighbor Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #16213e;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .login-box {
            max-width: 500px;
            margin: 100px auto;
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: none;
            background: #0f3460;
            color: white;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover { background: #c73652; }

        /* SHOP */
        #shopSection { display: none; padding: 20px; }

        .stats {
            background: #16213e;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 15px;
            color: #aaa;
        }

        .stats span { color: #e94560; font-weight: bold; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .card:hover { border-color: #e94560; }

        .card.owned { border-color: #2ecc71; }

        .card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
            background: #0f3460;
            border-radius: 8px;
        }

        .card .name {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .card .price {
            font-size: 12px;
            color: #e94560;
            margin-bottom: 8px;
        }

        .card .owned-badge {
            background: #2ecc71;
            color: white;
            padding: 5px;
            border-radius: 5px;
            font-size: 12px;
        }

        .card .buy-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }

        .card .buy-btn:hover { background: #c73652; }
    </style>
</head>
<body>

    <div class="header">🏠 Secret Neighbor Shop</div>

    <div class="login-box" id="loginBox">
        <h2>Enter Your Token</h2>
        <p style="color: #aaa; margin-top: 10px; font-size: 13px;">
            paste your X-Authorization token from Fiddler
        </p>
        <input type="text" id="tokenInput" placeholder="paste token here..."/>
        <button onclick="loadShop()">Load Shop</button>
    </div>

    <div id="shopSection">
        <div class="stats">
            items: <span id="totalCount">0</span> |
            owned: <span id="ownedCount">0</span> |
            not owned: <span id="notOwnedCount">0</span>
        </div>
        <div class="grid" id="itemGrid"></div>
    </div>

    <script>
        const HOST = "https://bdff1.playfabapi.com";
        let userToken = "";
        let userInventory = [];
        let catalog = [];

        async function loadShop() {
            const token = document.getElementById("tokenInput").value.trim();
            if (!token) { alert("paste your token first!"); return; }
            userToken = token;

            const [inventoryRes, catalogRes] = await Promise.all([
                fetch(`${HOST}/Client/GetUserInventory`, {
                    method: "POST",
                    headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                    body: JSON.stringify({})
                }),
                fetch(`${HOST}/Client/GetCatalogItems`, {
                    method: "POST",
                    headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                    body: JSON.stringify({ "CatalogVersion": "Ingame" })
                })
            ]);

            const inventoryData = await inventoryRes.json();
            const catalogData = await catalogRes.json();

            userInventory = inventoryData.data.Inventory.map(i => i.ItemId);
            catalog = catalogData.data.Catalog.filter(i =>
                i.ItemClass === "Customization" || i.ItemClass === "Emotion"
            );

            // hide login show shop
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("shopSection").style.display = "block";

            // update stats
            const notOwned = catalog.filter(i => !userInventory.includes(i.ItemId)).length;
            document.getElementById("totalCount").textContent = catalog.length;
            document.getElementById("ownedCount").textContent = userInventory.length;
            document.getElementById("notOwnedCount").textContent = notOwned;

            // render items
            const grid = document.getElementById("itemGrid");
            grid.innerHTML = "";

            catalog.forEach(item => {
                const owned = userInventory.includes(item.ItemId);
                const prices = item.VirtualCurrencyPrices || {};
                const priceText = Object.keys(prices).length > 0
                    ? Object.entries(prices).map(([k,v]) => `${v} ${k}`).join(" / ")
                    : "free / special";

                const card = document.createElement("div");
                card.className = `card ${owned ? "owned" : ""}`;
                card.innerHTML = `
                    <img src="images/${item.ItemId}.png" onerror="this.src='images/placeholder.png'"/>
                    <div class="name">${item.ItemId}</div>
                    <div class="price">${priceText}</div>
                    ${owned
                        ? `<div class="owned-badge">✅ owned</div>`
                        : `<button class="buy-btn" onclick="buyItem('${item.ItemId}', ${JSON.stringify(prices)})">Buy</button>`
                    }
                `;
                grid.appendChild(card);
            });
        }

        async function buyItem(itemId, prices) {
        const currency = prices.FE !== undefined ? "FE" : "AC";
        const price = prices[currency] || 0;

        // find the button and disable it immediately
        const btn = document.querySelector(`[onclick="buyItem('${itemId}', ${JSON.stringify(prices)})"]`);
        if (btn) {
        btn.disabled = true;
        btn.textContent = "Buying...";
        btn.style.background = "#555";
        }

        const res = await fetch(`${HOST}/Client/PurchaseItem`, {
        method: "POST",
        headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
        body: JSON.stringify({
            CatalogVersion: "Ingame",
            ItemId: itemId,
            Price: price,
            VirtualCurrency: currency
        })
        });

        const data = await res.json();
        if (data.code === 200) {
        // update currency display
        const newFE = parseInt(document.getElementById("profileFE").textContent) - (currency === "FE" ? price : 0);
        const newAC = parseInt(document.getElementById("profileAC").textContent) - (currency === "AC" ? price : 0);
        if (currency === "FE") document.getElementById("profileFE").textContent = newFE;
        if (currency === "AC") document.getElementById("profileAC").textContent = newAC;

        // add to inventory and re-render
        userInventory.push(itemId);
        renderItems(catalog);
        alert(`✅ ${itemId} unlocked!`);
        } else {
        // re-enable button if failed
        if (btn) {
            btn.disabled = false;
            btn.textContent = "Buy";
            btn.style.background = "#e94560";
        }
        alert(`❌ failed: ${data.errorMessage}`);
        }
        }
      </script>

</body>
</html>
