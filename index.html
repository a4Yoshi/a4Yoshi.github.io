<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Neighbor Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #1a1a2e; color: white; font-family: Arial, sans-serif; }

        .header {
            background-color: #16213e;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .profile-bar {
            display: none;
            background: #16213e;
            padding: 15px 25px;
            text-align: center;
            font-size: 15px;
            border-bottom: 2px solid #e94560;
        }

        .profile-bar span { margin: 0 15px; color: #e94560; font-weight: bold; }

        .login-box {
            max-width: 500px;
            margin: 100px auto;
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: none;
            background: #0f3460;
            color: white;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover { background: #c73652; }

        #shopSection { display: none; padding: 20px; }

        .stats {
            background: #16213e;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            color: #aaa;
        }

        .stats span { color: #e94560; font-weight: bold; }

        .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }

        .tab-btn {
            padding: 7px 14px;
            background: #16213e;
            color: #aaa;
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .tab-btn:hover { border-color: #e94560; color: white; }
        .tab-btn.active { background: #e94560; color: white; border-color: #e94560; }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            align-items: center;
        }

        .filter-label { color: #aaa; font-size: 13px; margin-right: 4px; }

        .toggle-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #e94560;
            background: #e94560;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .toggle-btn.off { background: transparent; color: #aaa; border-color: #444; }
        .toggle-btn:hover { opacity: 0.8; }

        .divider { width: 1px; height: 28px; background: #333; margin: 0 4px; }

        .sort-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #444;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .sort-btn.active { border-color: #e94560; color: white; background: #16213e; }
        .sort-btn:hover { border-color: #e94560; color: white; }

        .search-box {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #444;
            background: #0f3460;
            color: white;
            font-size: 13px;
            outline: none;
            width: 180px;
            transition: 0.2s;
        }

        .search-box:focus { border-color: #e94560; }
        .search-box::placeholder { color: #555; }

        /* NORMAL GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .card:hover { border-color: #e94560; }
        .card.owned { border-color: #2ecc71; }
        .card.na { opacity: 0.4; }

        .card img {
            width: 100px; height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
            background: #0f3460;
            border-radius: 8px;
        }

        .card .name { font-size: 11px; color: #aaa; margin-bottom: 8px; word-break: break-all; }
        .card .price { font-size: 12px; color: #e94560; margin-bottom: 8px; }
        .card .owned-badge { background: #2ecc71; color: white; padding: 5px; border-radius: 5px; font-size: 12px; }
        .card .na-badge { background: #555; color: #aaa; padding: 5px; border-radius: 5px; font-size: 11px; }

        .card .buy-btn {
            background: #e94560; color: white;
            border: none; padding: 6px 12px;
            border-radius: 5px; cursor: pointer;
            font-size: 12px; width: 100%; transition: 0.2s;
        }

        .card .buy-btn:hover { background: #c73652; }
        .card .buy-btn:disabled { background: #555; cursor: not-allowed; }

        .no-img {
            width: 100px; height: 100px;
            background: #0f3460; border-radius: 8px;
            margin: 0 auto 10px;
            display: flex; align-items: center;
            justify-content: center;
            font-size: 11px; color: #555;
        }

        /* BUNDLE VIEW */
        .bundle-group {
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #2a2a4a;
            background: #16213e;
        }

        .bundle-group.cheaper { border-color: #2ecc71; }
        .bundle-group.expensive { border-color: #e94560; }
        .bundle-group.mixed { border-color: #f39c12; }
        .bundle-group.same { border-color: #3498db; }

        .bundle-group-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bundle-group-title { font-size: 16px; font-weight: bold; color: white; margin-bottom: 4px; }
        .bundle-price-line { font-size: 13px; color: #aaa; margin-bottom: 3px; }
        .bundle-price-line b { color: white; }

        .savings-line { font-size: 13px; margin-top: 4px; font-weight: bold; }
        .savings-line.green { color: #2ecc71; }
        .savings-line.red { color: #e94560; }
        .savings-line.orange { color: #f39c12; }
        .savings-line.blue { color: #3498db; }

        .bundle-buy-btn {
            padding: 8px 18px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .bundle-buy-btn:hover { background: #c73652; }
        .bundle-buy-btn.owned { background: #2ecc71; cursor: default; }
        .bundle-buy-btn.grayed { background: #555; cursor: not-allowed; }

        .buy-anyway-btn {
            padding: 5px 10px;
            background: transparent;
            color: #aaa;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            margin-top: 5px;
            display: block;
            transition: 0.2s;
        }

        .buy-anyway-btn:hover { border-color: #aaa; color: white; }

        .bundle-singles { display: flex; flex-wrap: wrap; gap: 10px; }

        .mini-card {
            background: #0f3460;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border: 2px solid transparent;
            width: 120px;
            transition: 0.2s;
        }

        .mini-card.owned { border-color: #2ecc71; }
        .mini-card.na { opacity: 0.4; }
        .mini-card.same-price { border-color: #3498db; }

        .mini-card img {
            width: 70px; height: 70px;
            object-fit: contain;
            background: #16213e;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .mini-no-img {
            width: 70px; height: 70px;
            background: #16213e; border-radius: 6px;
            margin: 0 auto 6px;
            display: flex; align-items: center;
            justify-content: center;
            font-size: 10px; color: #555;
        }

        .mini-name { font-size: 10px; color: #aaa; margin-bottom: 4px; }
        .mini-price { font-size: 11px; color: #e94560; margin-bottom: 6px; }
        .mini-price.blue { color: #3498db; }
        .mini-owned { background: #2ecc71; color: white; padding: 4px; border-radius: 5px; font-size: 11px; }
        .mini-na { background: #555; color: #aaa; padding: 4px; border-radius: 5px; font-size: 10px; }

        .mini-buy {
            background: #e94560; color: white;
            border: none; padding: 4px 8px;
            border-radius: 5px; cursor: pointer;
            font-size: 11px; width: 100%; margin-bottom: 3px;
        }

        .mini-buy:hover { background: #c73652; }
        .mini-buy:disabled { background: #555; cursor: not-allowed; }
        .mini-buy.grayed { background: #555; cursor: not-allowed; }

        /* POPUP */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .popup-overlay.show { display: flex; }

        .popup {
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .popup h3 { color: #e94560; margin-bottom: 15px; font-size: 18px; }
        .popup p { color: #aaa; font-size: 14px; margin-bottom: 20px; line-height: 1.8; }
        .popup-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .popup-btns button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-bundle { background: #e94560; color: white; }
        .btn-single { background: #0f3460; color: white; }
        .btn-cancel { background: #333; color: #aaa; }
        .btn-bundle:hover { background: #c73652; }
        .btn-single:hover { background: #1a4a8a; }
    </style>
</head>
<body>

<div class="header">🏠 Secret Neighbor Shop</div>

<div class="profile-bar" id="profileBar">
    👤 <span id="profileName"></span> |
    🪙 FE (Coins): <span id="profileFE"></span> |
    🎟️ AC (Tickets): <span id="profileAC"></span>
</div>

<div class="login-box" id="loginBox">
    <h2>Enter Your Token</h2>
    <p style="color: #aaa; margin-top: 10px; font-size: 13px;">
        paste your X-Authorization token from Fiddler
    </p>
    <input type="text" id="tokenInput" placeholder="paste token here..."/>
    <button onclick="loadShop()">Load Shop</button>
</div>

<div id="shopSection">
    <div class="stats">
        items: <span id="totalCount">0</span> |
        owned: <span id="ownedCount">0</span> |
        not owned: <span id="notOwnedCount">0</span>
    </div>

    <div class="tabs" id="tabsBar"></div>

    <div class="filter-bar">
        <span class="filter-label">Show:</span>
        <button class="toggle-btn" id="toggle-FE" onclick="toggleFilter('FE')">🪙 FE (Coins)</button>
        <button class="toggle-btn" id="toggle-AC" onclick="toggleFilter('AC')">🎟️ AC (Tickets)</button>
        <button class="toggle-btn" id="toggle-NA" onclick="toggleFilter('NA')">🚫 N/A</button>
        <div class="divider"></div>
        <span class="filter-label">Sort:</span>
        <button class="sort-btn" id="sort-asc" onclick="setSort('asc')">Price ↑</button>
        <button class="sort-btn" id="sort-desc" onclick="setSort('desc')">Price ↓</button>
        <div class="divider"></div>
        <span class="filter-label">View:</span>
        <button class="sort-btn" id="view-bundle" onclick="toggleBundleView()">📦 By Bundle</button>
        <div class="divider"></div>
        <input class="search-box" id="searchBox" type="text" placeholder="🔍 Search..." oninput="renderItems()"/>
    </div>

    <div id="itemGrid"></div>
</div>

<!-- POPUP -->
<div class="popup-overlay" id="bundlePopup">
    <div class="popup">
        <h3>💡 Bundle vs Singles</h3>
        <p id="popupText"></p>
        <div class="popup-btns">
            <button class="btn-bundle" id="popupBundleBtn">Buy Bundle</button>
            <button class="btn-single" id="popupSingleBtn">Buy Single</button>
            <button class="btn-cancel" onclick="closePopup()">Cancel</button>
        </div>
    </div>
</div>

<script>
    const HOST = "https://bdff1.playfabapi.com";
    let userToken = "";
    let userInventory = [];
    let catalog = [];
    let activeTab = "ALL";
    let sortMode = null;
    let filters = { FE: true, AC: true, NA: true };
    let bundleView = false;

    const NEIGHBOR_ALIASES = ["Neighbor", "Pumpkin", "Scary", "Basic"];

    const HIDDEN_PREFIXES = [
        "2019", "2020", "2020-05", "00001V", "00001X", "00001Y", "00001Z", "00001W",
        "9N15R5CPSDS7", "9N3TFBPS0S71", "9PF5VJVSLBTK", "9PHM1Z3BL1V7",
        "SWITCH", "com", "2021", "2022", "2023"
    ];

    const TAB_ORDER = [
        "ALL", "OWNED", "NOT OWNED",
        "Bagger", "Brave", "Detective", "Engineer", "Inventor", "Leader", "Quentin",
        "Journalist", "Scout", "Neighbor", "Butcher", "Clown",
        "Ghost", "Guest", "Hunter", "Emotion"
    ];

    // manual skin name aliases — maps inconsistent single names to bundle names
    const SKIN_ALIASES = {
        "sr": "SpeedRunner",
        "elf_01": "Elf",
    };

    // normalize skin name for grouping — lowercase + apply aliases
    function normalizeSkin(rawSkin) {
        const lower = rawSkin.toLowerCase().trim();
        return SKIN_ALIASES[lower] ? SKIN_ALIASES[lower].toLowerCase() : lower;
    }

    // display name for skin — capitalize first letter
    function displaySkin(normalized) {
        // reverse alias lookup for display
        const reverseAlias = Object.entries(SKIN_ALIASES).find(([k, v]) => v.toLowerCase() === normalized);
        if (reverseAlias) return reverseAlias[1];
        return normalized.charAt(0).toUpperCase() + normalized.slice(1);
    }

    function getCharacter(itemId) {
        const raw = itemId.trim().split("_")[0];
        if (NEIGHBOR_ALIASES.map(a => a.toLowerCase()).includes(raw.toLowerCase())) return "Neighbor";
        if (raw.toLowerCase() === "emotion") return "Emotion";
        // capitalize first letter for display
        return raw.charAt(0).toUpperCase() + raw.slice(1);
    }

    function getRawCharacter(itemId) {
        return itemId.trim().split("_")[0];
    }

    function isHidden(itemId) {
        return HIDDEN_PREFIXES.includes(itemId.trim().split("_")[0]);
    }

    function getCurrencyType(item) {
        const p = item.VirtualCurrencyPrices || {};
        if (p.FE !== undefined) return "FE";
        if (p.AC !== undefined) return "AC";
        return "NA";
    }

    function getPrice(item) {
        const p = item.VirtualCurrencyPrices || {};
        return p.FE ?? p.AC ?? 0;
    }

    function priceTag(prices) {
        if (!prices) return "Not Purchasable";
        if (prices.FE !== undefined) return `🪙 (C.) ${prices.FE} FE`;
        if (prices.AC !== undefined) return `🎟️ (T.) ${prices.AC} AC`;
        return "Not Purchasable";
    }

    function currencyFull(cur) {
        if (cur === "FE") return "🪙 FE (Coins)";
        if (cur === "AC") return "🎟️ AC (Tickets)";
        return "";
    }

    // get skin parts from itemId — handles 3 and 4 part names
    function getSkinKey(itemId) {
        const parts = itemId.trim().split("_");
        // parts[0] = char, parts[1] = slot, parts[2..] = skin name
        const skinRaw = parts.slice(2).join("_");
        return normalizeSkin(skinRaw);
    }

    function getSlot(itemId) {
        return itemId.trim().split("_")[1] || "";
    }

    function isBundle(itemId) {
        return itemId.trim().split("_")[1].toLowerCase() === "bundle";
    }

    // find bundle across aliases and skin alias mapping
    function findBundle(rawChar, normalizedSkin) {
        const charsToSearch = NEIGHBOR_ALIASES.map(a => a.toLowerCase()).includes(rawChar.toLowerCase())
            ? NEIGHBOR_ALIASES
            : [rawChar];

        // possible bundle skin names (original + reverse alias)
        const skinVariants = [normalizedSkin];
        const reverseAlias = Object.entries(SKIN_ALIASES).find(([k, v]) => v.toLowerCase() === normalizedSkin);
        if (reverseAlias) skinVariants.push(reverseAlias[0]);
        // also try capitalized
        skinVariants.push(normalizedSkin.charAt(0).toUpperCase() + normalizedSkin.slice(1));
        if (reverseAlias) skinVariants.push(reverseAlias[1]);

        for (const char of charsToSearch) {
            for (const skin of skinVariants) {
                const b = catalog.find(i =>
                    i.ItemId.trim().toLowerCase() === `${char.toLowerCase()}_bundle_${skin.toLowerCase()}`
                );
                if (b) return b;
            }
        }
        return null;
    }

    function compareBundle(bundle, singles) {
        if (!bundle) return null;
        const bp = bundle.VirtualCurrencyPrices || {};
        const bundleCur = bp.FE !== undefined ? "FE" : bp.AC !== undefined ? "AC" : null;
        if (!bundleCur) return null;
        const bundlePrice = bp[bundleCur];

        const notOwned = singles.filter(i => !userInventory.includes(i.ItemId.trim()));
        if (notOwned.length === 0) return { type: "all_owned" };

        const purchasable = notOwned.filter(i => getCurrencyType(i) !== "NA");
        if (purchasable.length === 0) return null;

        const singleCurs = [...new Set(purchasable.map(i => getCurrencyType(i)))];
        const singleCur = singleCurs.length === 1 ? singleCurs[0] : "MIXED";

        if (singleCur === "MIXED" || singleCur !== bundleCur) {
            const singlesTotal = purchasable.reduce((s, i) => s + getPrice(i), 0);
            return { type: "mixed", bundleCur, bundlePrice, singlesTotal, singlesCur: singleCur };
        }

        const singlesTotal = purchasable.reduce((s, i) => s + getPrice(i), 0);
        const diff = singlesTotal - bundlePrice;

        if (diff > 0) return { type: "cheaper", bundleCur, bundlePrice, singlesTotal, singlesCur: singleCur, savings: diff };
        if (diff < 0) return { type: "expensive", bundleCur, bundlePrice, singlesTotal, singlesCur: singleCur, savings: Math.abs(diff) };
        return { type: "same", bundleCur, bundlePrice, singlesTotal, singlesCur: singleCur, savings: 0 };
    }

    function toggleFilter(type) {
        filters[type] = !filters[type];
        document.getElementById(`toggle-${type}`).className = `toggle-btn ${filters[type] ? "" : "off"}`;
        renderItems();
    }

    function setSort(mode) {
        if (sortMode === mode) {
            sortMode = null;
            document.getElementById(`sort-${mode}`).className = "sort-btn";
        } else {
            sortMode = mode;
            document.getElementById("sort-asc").className = `sort-btn ${mode === "asc" ? "active" : ""}`;
            document.getElementById("sort-desc").className = `sort-btn ${mode === "desc" ? "active" : ""}`;
        }
        renderItems();
    }

    function toggleBundleView() {
        bundleView = !bundleView;
        document.getElementById("view-bundle").className = `sort-btn ${bundleView ? "active" : ""}`;
        renderItems();
    }

    async function loadShop() {
        const token = document.getElementById("tokenInput").value.trim();
        if (!token) { alert("paste your token first!"); return; }
        userToken = token;

        const [profileRes, inventoryRes, catalogRes] = await Promise.all([
            fetch(`${HOST}/Client/GetAccountInfo`, {
                method: "POST",
                headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                body: JSON.stringify({})
            }),
            fetch(`${HOST}/Client/GetUserInventory`, {
                method: "POST",
                headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                body: JSON.stringify({})
            }),
            fetch(`${HOST}/Client/GetCatalogItems`, {
                method: "POST",
                headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                body: JSON.stringify({ "CatalogVersion": "Ingame" })
            })
        ]);

        const profileData = await profileRes.json();
        const inventoryData = await inventoryRes.json();
        const catalogData = await catalogRes.json();

        const displayName = profileData.data.AccountInfo.TitleInfo.DisplayName;
        const currencies = inventoryData.data.VirtualCurrency;
        document.getElementById("profileName").textContent = displayName;
        document.getElementById("profileFE").textContent = currencies.FE || 0;
        document.getElementById("profileAC").textContent = currencies.AC || 0;
        document.getElementById("profileBar").style.display = "block";

        userInventory = inventoryData.data.Inventory.map(i => i.ItemId.trim());
        catalog = catalogData.data.Catalog.filter(i =>
            (i.ItemClass === "Customization" || i.ItemClass === "Emotion" || i.ItemClass === "Bundle") &&
            !isHidden(i.ItemId)
        );

        document.getElementById("loginBox").style.display = "none";
        document.getElementById("shopSection").style.display = "block";

        updateStats();
        buildTabs();
        renderItems();
    }

    function buildTabs() {
        const present = new Set(catalog.map(i => getCharacter(i.ItemId)));
        const tabsBar = document.getElementById("tabsBar");
        tabsBar.innerHTML = "";

        TAB_ORDER.forEach(tab => {
            const isSpecial = ["ALL", "OWNED", "NOT OWNED"].includes(tab);
            if (!isSpecial && !present.has(tab)) return;
            const btn = document.createElement("button");
            btn.className = `tab-btn ${tab === activeTab ? "active" : ""}`;
            btn.textContent = tab;
            btn.onclick = () => switchTab(tab);
            tabsBar.appendChild(btn);
        });

        present.forEach(char => {
            if (!TAB_ORDER.includes(char) && !HIDDEN_PREFIXES.includes(char.toLowerCase())) {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${char === activeTab ? "active" : ""}`;
                btn.textContent = char;
                btn.onclick = () => switchTab(char);
                tabsBar.appendChild(btn);
            }
        });
    }

    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.className = `tab-btn ${btn.textContent === tab ? "active" : ""}`;
        });
        renderItems();
    }

    function getSearchQuery() {
        return (document.getElementById("searchBox")?.value || "").toLowerCase().trim();
    }

    function getTabItems() {
        if (activeTab === "OWNED") return catalog.filter(i => userInventory.includes(i.ItemId.trim()));
        if (activeTab === "NOT OWNED") return catalog.filter(i => !userInventory.includes(i.ItemId.trim()));
        if (activeTab !== "ALL") return catalog.filter(i => getCharacter(i.ItemId) === activeTab);
        return catalog;
    }

    function applyFiltersAndSort(items) {
        const q = getSearchQuery();
        if (q) items = items.filter(i => i.ItemId.toLowerCase().includes(q));
        items = items.filter(i => filters[getCurrencyType(i)]);
        if (sortMode === "asc") items = [...items].sort((a, b) => getPrice(a) - getPrice(b));
        else if (sortMode === "desc") items = [...items].sort((a, b) => getPrice(b) - getPrice(a));
        return items;
    }

    function renderItems() {
        bundleView ? renderBundleView() : renderGridView();
    }

    function renderGridView() {
        let items = applyFiltersAndSort(getTabItems());
        const grid = document.getElementById("itemGrid");
        grid.className = "grid";
        grid.innerHTML = "";

        items.forEach(item => {
            const owned = userInventory.includes(item.ItemId.trim());
            const prices = item.VirtualCurrencyPrices || {};
            const isNA = getCurrencyType(item) === "NA";
            const pe = encodeURIComponent(JSON.stringify(prices));

            const card = document.createElement("div");
            card.className = `card ${owned ? "owned" : ""} ${isNA ? "na" : ""}`;
            card.id = `card-${item.ItemId.trim()}`;
            card.innerHTML = `
                <img src="images/${item.ItemId.trim()}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/>
                <div class="no-img" style="display:none">no image</div>
                <div class="name">${item.ItemId.trim()}</div>
                <div class="price">${priceTag(prices)}</div>
                ${owned ? `<div class="owned-badge">✅ owned</div>`
                : isNA ? `<div class="na-badge">🚫 Not Purchasable</div>`
                : `<button class="buy-btn" id="btn-${item.ItemId.trim()}" onclick="checkBundle('${item.ItemId.trim()}', '${pe}')">Buy</button>`}
            `;
            grid.appendChild(card);
        });
    }

    function renderBundleView() {
        const grid = document.getElementById("itemGrid");
        grid.className = "";
        grid.innerHTML = "";

        const q = getSearchQuery();
        // bundle view ignores currency filters
        let items = getTabItems();
        if (q) items = items.filter(i => i.ItemId.toLowerCase().includes(q));

        // group by normalized char + normalized skin
        const groups = {};
        items.forEach(item => {
            const trimmed = item.ItemId.trim();
            const rawChar = getRawCharacter(trimmed);
            const normChar = getCharacter(trimmed); // already normalized (Neighbor etc)
            const skinKey = getSkinKey(trimmed);
            const key = `${normChar.toLowerCase()}_${skinKey}`;

            if (!groups[key]) {
                groups[key] = {
                    normChar,
                    skinKey,
                    displaySkinName: displaySkin(skinKey),
                    bundle: null,
                    singles: [],
                    rawChars: new Set()
                };
            }

            groups[key].rawChars.add(rawChar);

            if (isBundle(trimmed)) {
                groups[key].bundle = item;
            } else {
                groups[key].singles.push(item);
            }
        });

        // for groups without bundle — cross-alias search
        Object.values(groups).forEach(group => {
            if (!group.bundle) {
                for (const rc of group.rawChars) {
                    const b = findBundle(rc, group.skinKey);
                    if (b) { group.bundle = b; break; }
                }
            }
        });

        // sort groups: Scary-Pumpkin always shown as one group under Scary
        // merge duplicate groups (e.g. Pumpkin-Scary and Scary-Pumpkin)
        const seen = new Set();
        const finalGroups = [];
        Object.values(groups).forEach(group => {
            const key = `${group.normChar.toLowerCase()}_${group.skinKey}`;
            if (!seen.has(key)) {
                seen.add(key);
                finalGroups.push(group);
            }
        });

        finalGroups.forEach(group => {
            if (group.singles.length === 0 && !group.bundle) return;

            const cmp = compareBundle(group.bundle, group.singles);
            const bundleOwned = group.bundle && userInventory.includes(group.bundle.ItemId.trim());
            const allSinglesOwned = group.singles.length > 0 && group.singles.every(i => userInventory.includes(i.ItemId.trim()));

            // border color
            let groupClass = "bundle-group";
            if (cmp) {
                if (cmp.type === "cheaper") groupClass = "bundle-group cheaper";
                else if (cmp.type === "expensive") groupClass = "bundle-group expensive";
                else if (cmp.type === "mixed") groupClass = "bundle-group mixed";
                else if (cmp.type === "same") groupClass = "bundle-group same";
            }

            // savings line
            let savingsHtml = "";
            if (cmp) {
                if (cmp.type === "cheaper") {
                    savingsHtml = `<div class="savings-line green">✅ Bundle saves ${cmp.savings} ${currencyFull(cmp.bundleCur)}</div>`;
                } else if (cmp.type === "expensive") {
                    savingsHtml = `<div class="savings-line red">Bundle is more expensive — Singles save ${cmp.savings} ${currencyFull(cmp.singlesCur)}</div>`;
                } else if (cmp.type === "mixed") {
                    savingsHtml = `<div class="savings-line orange">⚠️ Different currencies — your choice<br>
                        Bundle: ${cmp.bundlePrice} ${currencyFull(cmp.bundleCur)}<br>
                        Singles: ${cmp.singlesTotal} ${currencyFull(cmp.singlesCur)}</div>`;
                } else if (cmp.type === "same") {
                    savingsHtml = `<div class="savings-line blue">Same price either way</div>`;
                } else if (cmp.type === "all_owned") {
                    savingsHtml = `<div class="savings-line" style="color:#2ecc71">✅ All singles already owned</div>`;
                }
            }

            // bundle button logic
            let bundleBtnHtml = "";
            if (group.bundle) {
                const bp = group.bundle.VirtualCurrencyPrices || {};
                const bpe = encodeURIComponent(JSON.stringify(bp));
                const bCur = getCurrencyType(group.bundle);
                const singlesTotal = cmp ? cmp.singlesTotal : null;
                const sCur = cmp ? cmp.singlesCur : null;

                if (bundleOwned) {
                    bundleBtnHtml = `<button class="bundle-buy-btn owned" disabled>✅ Bundle Owned</button>`;
                } else if (bCur === "NA") {
                    bundleBtnHtml = `<button class="bundle-buy-btn grayed" disabled>🚫 N/A</button>`;
                } else if (allSinglesOwned && !bundleOwned) {
                    // all singles owned but not bundle — gray it out
                    bundleBtnHtml = `
                        <div style="text-align:right">
                            <button class="bundle-buy-btn grayed" disabled>Buy Bundle — ${priceTag(bp)}</button>
                            <button class="buy-anyway-btn" onclick="showBundlePopup('${group.bundle.ItemId.trim()}', '${bpe}', ${JSON.stringify(singlesTotal)}, '${sCur}')">Buy anyway?</button>
                        </div>`;
                } else if (cmp && cmp.type === "expensive") {
                    // bundle more expensive — gray it out with buy anyway
                    bundleBtnHtml = `
                        <div style="text-align:right">
                            <button class="bundle-buy-btn grayed" disabled>Buy Bundle — ${priceTag(bp)}</button>
                            <button class="buy-anyway-btn" onclick="showBundlePopup('${group.bundle.ItemId.trim()}', '${bpe}', ${JSON.stringify(singlesTotal)}, '${sCur}')">Buy bundle anyway?</button>
                        </div>`;
                } else {
                    bundleBtnHtml = `
                        <button class="bundle-buy-btn" onclick="showBundlePopup('${group.bundle.ItemId.trim()}', '${bpe}', ${JSON.stringify(singlesTotal)}, '${sCur}')">
                            Buy Bundle — ${priceTag(bp)}
                        </button>`;
                }
            }

            // display title — prefer Scary over Pumpkin for Neighbor
            const rawCharsArr = [...group.rawChars];
            const preferredChar = rawCharsArr.includes("Scary") ? "Scary"
                : rawCharsArr.includes("Neighbor") ? "Neighbor"
                : rawCharsArr[0];
            const displayTitle = `${preferredChar} — ${group.displaySkinName}`;

            const safeKey = `${group.normChar}-${group.skinKey}`.replace(/[^a-z0-9-]/gi, "_");

            const groupEl = document.createElement("div");
            groupEl.className = groupClass;
            groupEl.innerHTML = `
                <div class="bundle-group-header">
                    <div>
                        <div class="bundle-group-title">${displayTitle}</div>
                        ${group.bundle
                            ? `<div class="bundle-price-line">Bundle: <b>${priceTag(group.bundle.VirtualCurrencyPrices)}</b></div>`
                            : `<div class="bundle-price-line" style="color:#555">No bundle available</div>`}
                        ${savingsHtml}
                    </div>
                    ${bundleBtnHtml}
                </div>
                <div class="bundle-singles" id="singles-${safeKey}"></div>
            `;
            grid.appendChild(groupEl);

            const singlesContainer = document.getElementById(`singles-${safeKey}`);
            const bundleCheaper = cmp && cmp.type === "cheaper";

            group.singles.forEach(item => {
                const trimmed = item.ItemId.trim();
                const owned = userInventory.includes(trimmed);
                const prices = item.VirtualCurrencyPrices || {};
                const isNA = getCurrencyType(item) === "NA";
                const isSame = cmp && cmp.type === "same";
                const slot = getSlot(trimmed).toUpperCase();
                const pe = encodeURIComponent(JSON.stringify(prices));

                let btnHtml = "";
                if (owned) {
                    btnHtml = `<div class="mini-owned">✅</div>`;
                } else if (isNA) {
                    btnHtml = `<div class="mini-na">🚫</div>`;
                } else if (bundleCheaper) {
                    // bundle cheaper — gray out single buy, add buy single anyway
                    btnHtml = `
                        <button class="mini-buy grayed" disabled>Buy</button>
                        <button class="buy-anyway-btn" onclick="buyItem('${trimmed}', ${JSON.stringify(prices)})">Buy single anyway</button>
                    `;
                } else {
                    btnHtml = `<button class="mini-buy" id="btn-${trimmed}" onclick="checkBundle('${trimmed}', '${pe}')">Buy</button>`;
                }

                const mini = document.createElement("div");
                mini.className = `mini-card ${owned ? "owned" : ""} ${isNA ? "na" : ""} ${isSame ? "same-price" : ""}`;
                mini.id = `card-${trimmed}`;
                mini.innerHTML = `
                    <img src="images/${trimmed}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/>
                    <div class="mini-no-img" style="display:none">no image</div>
                    <div class="mini-name">${slot}</div>
                    <div class="mini-price ${isSame ? "blue" : ""}">${priceTag(prices)}</div>
                    ${btnHtml}
                `;
                singlesContainer.appendChild(mini);
            });
        });
    }

    function showBundlePopup(bundleId, pricesEncoded, singlesTotal, singlesCur) {
        const prices = JSON.parse(decodeURIComponent(pricesEncoded));
        const bundleCur = getCurrencyType({ VirtualCurrencyPrices: prices });
        const bundlePrice = getPrice({ VirtualCurrencyPrices: prices });

        let compHtml = "";
        if (singlesTotal !== null && singlesCur && singlesCur !== "null") {
            if (singlesCur === bundleCur) {
                const diff = singlesTotal - bundlePrice;
                if (diff > 0) compHtml = `<span style="color:#2ecc71">✅ Bundle saves ${diff} ${currencyFull(bundleCur)}</span>`;
                else if (diff < 0) compHtml = `<span style="color:#e94560">Bundle is more expensive — Singles save ${Math.abs(diff)} ${currencyFull(singlesCur)}</span>`;
                else compHtml = `<span style="color:#3498db">Same price either way</span>`;
            } else {
                compHtml = `<span style="color:#f39c12">⚠️ Different currencies — your choice</span>`;
            }
        }

        document.getElementById("popupText").innerHTML = `
            <b>${bundleId}</b><br><br>
            Bundle: <b>${priceTag(prices)}</b><br>
            ${singlesTotal !== null && singlesCur && singlesCur !== "null"
                ? `Singles total: <b>${singlesTotal} ${currencyFull(singlesCur)}</b><br>`
                : ""}
            <br>${compHtml}
        `;

        document.getElementById("popupBundleBtn").onclick = () => { closePopup(); buyItem(bundleId, prices); };
        document.getElementById("popupSingleBtn").style.display = "none";
        document.getElementById("bundlePopup").className = "popup-overlay show";
    }

    function checkBundle(itemId, pricesEncoded) {
        const prices = JSON.parse(decodeURIComponent(pricesEncoded));
        const trimmed = itemId.trim();
        const rawChar = getRawCharacter(trimmed);
        const skinKey = getSkinKey(trimmed);

        const bundle = findBundle(rawChar, skinKey);
        if (!bundle || userInventory.includes(bundle.ItemId.trim())) {
            buyItem(trimmed, prices);
            return;
        }

        const singles = catalog.filter(i => {
            const t = i.ItemId.trim();
            if (isBundle(t)) return false;
            const rc = getRawCharacter(t);
            const sk = getSkinKey(t);
            const sameChar = rc.toLowerCase() === rawChar.toLowerCase() ||
                (NEIGHBOR_ALIASES.map(a=>a.toLowerCase()).includes(rc.toLowerCase()) &&
                 NEIGHBOR_ALIASES.map(a=>a.toLowerCase()).includes(rawChar.toLowerCase()));
            return sameChar && sk === skinKey;
        });

        const cmp = compareBundle(bundle, singles);
        if (!cmp || cmp.type === "all_owned") { buyItem(trimmed, prices); return; }

        const bpe = encodeURIComponent(JSON.stringify(bundle.VirtualCurrencyPrices || {}));
        showBundlePopup(bundle.ItemId.trim(), bpe, cmp.singlesTotal, cmp.singlesCur);

        document.getElementById("popupSingleBtn").style.display = "inline-block";
        document.getElementById("popupSingleBtn").textContent = "Buy Single";
        document.getElementById("popupSingleBtn").onclick = () => { closePopup(); buyItem(trimmed, prices); };
    }

    function closePopup() {
        document.getElementById("bundlePopup").className = "popup-overlay";
    }

    async function buyItem(itemId, prices) {
        const trimmed = itemId.trim();
        const currency = prices.FE !== undefined ? "FE" : "AC";
        const price = prices[currency] || 0;

        const btn = document.getElementById(`btn-${trimmed}`);
        if (btn) { btn.disabled = true; btn.textContent = "Buying..."; }

        const res = await fetch(`${HOST}/Client/PurchaseItem`, {
            method: "POST",
            headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
            body: JSON.stringify({ CatalogVersion: "Ingame", ItemId: trimmed, Price: price, VirtualCurrency: currency })
        });

        const data = await res.json();

        if (data.code === 200) {
            if (currency === "FE") {
                document.getElementById("profileFE").textContent =
                    parseInt(document.getElementById("profileFE").textContent) - price;
            } else {
                document.getElementById("profileAC").textContent =
                    parseInt(document.getElementById("profileAC").textContent) - price;
            }
            userInventory.push(trimmed);
            updateStats();
            renderItems();
            alert(`✅ ${trimmed} unlocked!`);
        } else {
            if (btn) { btn.disabled = false; btn.textContent = "Buy"; }
            alert(`❌ failed: ${data.errorMessage}`);
        }
    }

    function updateStats() {
        const notOwned = catalog.filter(i => !userInventory.includes(i.ItemId.trim())).length;
        document.getElementById("totalCount").textContent = catalog.length;
        document.getElementById("ownedCount").textContent = userInventory.length;
        document.getElementById("notOwnedCount").textContent = notOwned;
    }
</script>
</body>
