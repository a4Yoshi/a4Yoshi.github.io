<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Neighbor Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #16213e;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .login-box {
            max-width: 500px;
            margin: 100px auto;
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: none;
            background: #0f3460;
            color: white;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #c73652;
        }
    </style>
</head>
<body>

    <div class="header">🏠 Secret Neighbor Shop</div>

    <div class="login-box">
        <h2>Enter Your Token</h2>
        <p style="color: #aaa; margin-top: 10px; font-size: 13px;">
            paste your X-Authorization token from Fiddler
        </p>
        <input type="text" id="tokenInput" placeholder="paste token here..."/>
        <button onclick="loadShop()">Load Shop</button>
    </div>

    <script>
        const HOST = "https://bdff1.playfabapi.com";

        async function loadShop() {
            const token = document.getElementById("tokenInput").value.trim();
            if (!token) {
                alert("paste your token first!");
                return;
            }
            alert("token saved! catalog loading coming next 😏");
        }
    </script>

</body>
</html>
