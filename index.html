<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Neighbor Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #16213e;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .profile-bar {
            display: none;
            background: #16213e;
            padding: 15px 25px;
            text-align: center;
            font-size: 15px;
            border-bottom: 2px solid #e94560;
        }

        .profile-bar span {
            margin: 0 15px;
            color: #e94560;
            font-weight: bold;
        }

        .login-box {
            max-width: 500px;
            margin: 100px auto;
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: none;
            background: #0f3460;
            color: white;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover { background: #c73652; }

        #shopSection { display: none; padding: 20px; }

        .stats {
            background: #16213e;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            color: #aaa;
        }

        .stats span { color: #e94560; font-weight: bold; }

        /* TABS */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 7px 14px;
            background: #16213e;
            color: #aaa;
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .tab-btn:hover { border-color: #e94560; color: white; }
        .tab-btn.active { background: #e94560; color: white; border-color: #e94560; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .card:hover { border-color: #e94560; }
        .card.owned { border-color: #2ecc71; }
        .card.na { opacity: 0.4; }

        .card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
            background: #0f3460;
            border-radius: 8px;
        }

        .card .name {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .card .price {
            font-size: 12px;
            color: #e94560;
            margin-bottom: 8px;
        }

        .card .owned-badge {
            background: #2ecc71;
            color: white;
            padding: 5px;
            border-radius: 5px;
            font-size: 12px;
        }

        .card .na-badge {
            background: #555;
            color: #aaa;
            padding: 5px;
            border-radius: 5px;
            font-size: 11px;
        }

        .card .buy-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            transition: 0.2s;
        }

        .card .buy-btn:hover { background: #c73652; }
        .card .buy-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">🏠 Secret Neighbor Shop</div>

    <div class="profile-bar" id="profileBar">
        👤 <span id="profileName"></span> |
        🪙 FE: <span id="profileFE"></span> |
        🎫 AC: <span id="profileAC"></span>
    </div>

    <div class="login-box" id="loginBox">
        <h2>Enter Your Token</h2>
        <p style="color: #aaa; margin-top: 10px; font-size: 13px;">
            paste your X-Authorization token from Fiddler
        </p>
        <input type="text" id="tokenInput" placeholder="paste token here..."/>
        <button onclick="loadShop()">Load Shop</button>
    </div>

    <div id="shopSection">
        <div class="stats">
            items: <span id="totalCount">0</span> |
            owned: <span id="ownedCount">0</span> |
            not owned: <span id="notOwnedCount">0</span>
        </div>
        <div class="tabs" id="tabsBar"></div>
        <div class="grid" id="itemGrid"></div>
    </div>

    <script>
        const HOST = "https://bdff1.playfabapi.com";
        let userToken = "";
        let userInventory = [];
        let catalog = [];
        let activeTab = "ALL";

        async function loadShop() {
            const token = document.getElementById("tokenInput").value.trim();
            if (!token) { alert("paste your token first!"); return; }
            userToken = token;

            const [profileRes, inventoryRes, catalogRes] = await Promise.all([
                fetch(`${HOST}/Client/GetAccountInfo`, {
                    method: "POST",
                    headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                    body: JSON.stringify({})
                }),
                fetch(`${HOST}/Client/GetUserInventory`, {
                    method: "POST",
                    headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                    body: JSON.stringify({})
                }),
                fetch(`${HOST}/Client/GetCatalogItems`, {
                    method: "POST",
                    headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                    body: JSON.stringify({ "CatalogVersion": "Ingame" })
                })
            ]);

            const profileData = await profileRes.json();
            const inventoryData = await inventoryRes.json();
            const catalogData = await catalogRes.json();

            // profile bar
            const displayName = profileData.data.AccountInfo.TitleInfo.DisplayName;
            const currencies = inventoryData.data.VirtualCurrency;
            document.getElementById("profileName").textContent = displayName;
            document.getElementById("profileFE").textContent = currencies.FE || 0;
            document.getElementById("profileAC").textContent = currencies.AC || 0;
            document.getElementById("profileBar").style.display = "block";

            userInventory = inventoryData.data.Inventory.map(i => i.ItemId);
            catalog = catalogData.data.Catalog.filter(i =>
                i.ItemClass === "Customization" ||
                i.ItemClass === "Emotion" ||
                i.ItemClass === "Bundle"
            );

            document.getElementById("loginBox").style.display = "none";
            document.getElementById("shopSection").style.display = "block";

            updateStats();
            buildTabs();
            renderItems();
        }

        function buildTabs() {
            // get unique characters from item IDs
            const characters = ["ALL", "OWNED", "NOT OWNED"];
            const seen = new Set();
            catalog.forEach(item => {
                const char = item.ItemId.split("_")[0];
                if (!seen.has(char)) {
                    seen.add(char);
                    characters.push(char);
                }
            });

            const tabsBar = document.getElementById("tabsBar");
            tabsBar.innerHTML = "";
            characters.forEach(char => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${char === activeTab ? "active" : ""}`;
                btn.textContent = char;
                btn.onclick = () => switchTab(char);
                tabsBar.appendChild(btn);
            });
        }

        function switchTab(char) {
            activeTab = char;
            // update active tab style
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.className = `tab-btn ${btn.textContent === char ? "active" : ""}`;
            });
            renderItems();
        }

        function renderItems() {
            let items = catalog;

            // filter by tab
            if (activeTab === "OWNED") {
                items = catalog.filter(i => userInventory.includes(i.ItemId));
            } else if (activeTab === "NOT OWNED") {
                items = catalog.filter(i => !userInventory.includes(i.ItemId));
            } else if (activeTab !== "ALL") {
                items = catalog.filter(i => i.ItemId.split("_")[0] === activeTab);
            }

            const grid = document.getElementById("itemGrid");
            grid.innerHTML = "";

            items.forEach(item => {
                const owned = userInventory.includes(item.ItemId);
                const prices = item.VirtualCurrencyPrices || {};
                const hasFE = prices.FE !== undefined;
                const hasAC = prices.AC !== undefined;
                const hasRM = prices.RM !== undefined;
                const isNA = !hasFE && !hasAC;

                let priceText = "";
                if (hasFE) priceText = `🪙 ${prices.FE} FE`;
                else if (hasAC) priceText = `🎫 ${prices.AC} AC`;
                else if (hasRM) priceText = `💲 Real Money`;
                else priceText = "Special";

                const pricesEncoded = encodeURIComponent(JSON.stringify(prices));

                const card = document.createElement("div");
                card.className = `card ${owned ? "owned" : ""} ${isNA || hasRM ? "na" : ""}`;
                card.id = `card-${item.ItemId}`;
                card.innerHTML = `
                    <img src="images/${item.ItemId}.png" onerror="this.src='images/placeholder.png'"/>
                    <div class="name">${item.ItemId}</div>
                    <div class="price">${priceText}</div>
                    ${owned
                        ? `<div class="owned-badge">✅ owned</div>`
                        : isNA || hasRM
                            ? `<div class="na-badge">🚫 Not obtainable</div>`
                            : `<button class="buy-btn" id="btn-${item.ItemId}" onclick="buyItem('${item.ItemId}', '${pricesEncoded}')">Buy</button>`
                    }
                `;
                grid.appendChild(card);
            });
        }

        async function buyItem(itemId, pricesEncoded) {
            const prices = JSON.parse(decodeURIComponent(pricesEncoded));
            const currency = prices.FE !== undefined ? "FE" : "AC";
            const price = prices[currency] || 0;

            // disable button immediately
            const btn = document.getElementById(`btn-${itemId}`);
            if (btn) {
                btn.disabled = true;
                btn.textContent = "Buying...";
            }

            const res = await fetch(`${HOST}/Client/PurchaseItem`, {
                method: "POST",
                headers: { "X-Authorization": userToken, "Content-Type": "application/json" },
                body: JSON.stringify({
                    CatalogVersion: "Ingame",
                    ItemId: itemId,
                    Price: price,
                    VirtualCurrency: currency
                    // NO StoreId — this is the fix that makes it work!
                })
            });

            const data = await res.json();

            if (data.code === 200) {
                // update balance
                if (currency === "FE") {
                    const cur = parseInt(document.getElementById("profileFE").textContent);
                    document.getElementById("profileFE").textContent = cur - price;
                } else {
                    const cur = parseInt(document.getElementById("profileAC").textContent);
                    document.getElementById("profileAC").textContent = cur - price;
                }

                // flip card to owned
                userInventory.push(itemId);
                const card = document.getElementById(`card-${itemId}`);
                if (card) {
                    card.className = "card owned";
                    card.querySelector(".buy-btn").outerHTML = `<div class="owned-badge">✅ owned</div>`;
                }

                updateStats();
                alert(`✅ ${itemId} unlocked!`);
            } else {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = "Buy";
                }
                alert(`❌ failed: ${data.errorMessage}`);
            }
        }

        function updateStats() {
            const notOwned = catalog.filter(i => !userInventory.includes(i.ItemId)).length;
            document.getElementById("totalCount").textContent = catalog.length;
            document.getElementById("ownedCount").textContent = userInventory.length;
            document.getElementById("notOwnedCount").textContent = notOwned;
        }
    </script>

</body>
</html>
