<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a4Yoshi Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #e94560;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            font-size: 18px;
            margin-bottom: 40px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #16213e;
            border-radius: 16px;
            padding: 30px 20px;
            border: 2px solid #2a2a4a;
            transition: 0.3s;
            text-decoration: none;
            color: white;
        }
        .card:hover {
            border-color: #e94560;
            transform: translateY(-5px);
        }
        .card .icon { font-size: 48px; margin-bottom: 12px; }
        .card h2 { color: #e94560; font-size: 22px; margin-bottom: 8px; }
        .card p { color: #aaa; font-size: 14px; line-height: 1.6; }
        .card .badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 10px;
        }
        .leaderboard-preview {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 40px;
            border: 2px solid #2a2a4a;
        }
        .leaderboard-preview h3 {
            color: #e94560;
            margin-bottom: 12px;
        }
        .lb-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #1a1a3e;
            font-size: 14px;
            color: #ccc;
        }
        .lb-row:last-child { border-bottom: none; }
        .lb-rank { color: #e94560; font-weight: bold; width: 40px; }
        .lb-name { flex: 1; text-align: left; }
        .lb-level { color: #e94560; font-weight: bold; }
        .lb-rank-1 .lb-rank { color: #ffd700; }
        .lb-rank-2 .lb-rank { color: #c0c0c0; }
        .lb-rank-3 .lb-rank { color: #cd7f32; }
        .footer {
            margin-top: 40px;
            color: #555;
            font-size: 13px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online { background: #2ecc71; }
        .status-dot.offline { background: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 a4Yshi</h1>
        <p class="subtitle">Tools &amp; Utilities for Secret Neighbor</p>

        <div class="card-grid">
            <a href="https://leaderboard.a4yoshi.github.io" class="card" target="_blank">
                <div class="icon">🏆</div>
                <h2>Leaderboard</h2>
                <p>View top players and rankings. Updated in real-time.</p>
                <span class="badge">Live</span>
            </a>
            <a href="https://shop.a4yoshi.github.io" class="card" target="_blank">
                <div class="icon">🛒</div>
                <h2>Item Shop</h2>
                <p>Browse and purchase items. Login with your X-Authorization token.</p>
                <span class="badge">Secure</span>
            </a>
        </div>

        <!-- Leaderboard Preview -->
        <div class="leaderboard-preview" id="lbPreview">
            <h3>🏆 Top Players</h3>
            <div id="lbPreviewContent">
                <div style="color:#555;padding:12px;">Loading leaderboard...</div>
            </div>
        </div>

        <div class="footer">
            <span class="status-dot online"></span> All systems operational &bull; Updated 2026
        </div>
    </div>

    <script>
        // Fetch leaderboard for preview
        async function loadPreviewLeaderboard() {
            const container = document.getElementById('lbPreviewContent');
            try {
                const res = await fetch('https://bdff1.playfabapi.com/Client/GetLeaderboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        MaxResultsCount: 5,
                        StartPosition: 0,
                        StatisticName: 'LeaderBoard_AccountLevelSTEAM'
                    })
                });
                const data = await res.json();
                if (data.code === 200 && data.data && data.data.Leaderboard) {
                    let html = '';
                    data.data.Leaderboard.slice(0, 5).forEach((entry, idx) => {
                        const rank = idx + 1;
                        const rankClass = rank <= 3 ? `lb-rank-${rank}` : '';
                        html += `
                            <div class="lb-row ${rankClass}">
                                <span class="lb-rank">#${rank}</span>
                                <span class="lb-name">${entry.DisplayName || entry.PlayFabId || 'Anonymous'}</span>
                                <span class="lb-level">Level ${entry.StatValue || 0}</span>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div style="color:#555;padding:12px;">Leaderboard temporarily unavailable</div>';
                }
            } catch (e) {
                container.innerHTML = '<div style="color:#555;padding:12px;">Failed to load leaderboard</div>';
            }
        }
        loadPreviewLeaderboard();
    </script>
</body>
</html>
