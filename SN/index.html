<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a4Yoshi Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #e94560;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #16213e;
            border-radius: 16px;
            padding: 30px 20px;
            border: 2px solid #2a2a4a;
            transition: 0.3s;
            text-decoration: none;
            color: white;
            cursor: pointer;
            display: block;
        }
        .card:hover {
            border-color: #e94560;
            transform: translateY(-5px);
        }
        .card .icon { font-size: 48px; margin-bottom: 12px; }
        .card h2 { color: #e94560; font-size: 22px; margin-bottom: 8px; }
        .card p { color: #aaa; font-size: 14px; line-height: 1.6; }
        .card .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        .card .badge.steam {
            background: #1a1a2e;
            color: #66c0f4;
            border: 1px solid #66c0f4;
        }
        .card .badge.shop-locked {
            background: #e94560;
            color: white;
        }
        .card .badge.shop-unlocked {
            background: #2ecc71;
            color: #000;
        }
        .shop-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Token Section (Bottom) */
        .token-section {
            background: #16213e;
            border-radius: 12px;
            padding: 20px 25px;
            border: 2px solid #2a2a4a;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .token-section label {
            color: #aaa;
            font-size: 14px;
            font-weight: bold;
        }
        .token-section input {
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #0f3460;
            color: white;
            font-size: 14px;
            flex: 1;
            min-width: 280px;
            font-family: monospace;
        }
        .token-section input:focus { border-color: #e94560; outline: none; }
        .token-section input::placeholder { color: #555; }
        .token-section .btn {
            padding: 10px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .token-section .btn:hover { background: #c73652; }
        .token-section .btn-secondary {
            background: #0f3460;
        }
        .token-section .btn-secondary:hover { background: #1a4a8a; }
        .token-status {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 12px;
        }
        .token-status.valid { color: #2ecc71; }
        .token-status.invalid { color: #e94560; }
        .token-status .masked {
            font-family: monospace;
            font-size: 12px;
            background: #0a0a1a;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .footer {
            margin-top: 25px;
            color: #555;
            font-size: 13px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online { background: #2ecc71; }

        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            .token-section { flex-direction: column; }
            .token-section input { min-width: 100%; width: 100%; }
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 a4Yoshi</h1>
        <p class="subtitle">Tools &amp; Utilities for Secret Neighbor</p>

        <!-- Cards -->
        <div class="card-grid">
            <a href="https://a4yoshi.github.io/leaderboard" class="card" target="_blank">
                <div class="icon">🏆</div>
                <h2>Leaderboard</h2>
                <p>View top Steam players and rankings. Updated in real-time.</p>
                <span class="badge steam">Steam</span>
            </a>
            <div onclick="openShop()">
                <div class="card shop-card disabled" id="shopCard">
                    <div class="icon">🛒</div>
                    <h2>Item Shop</h2>
                    <p id="shopDesc">🔒 Please save your X-Authorization token below to unlock</p>
                    <span class="badge shop-locked" id="shopBadge">🔒 Locked</span>
                </div>
            </div>
        </div>

        <!-- Token Section (Bottom) -->
        <div class="token-section">
            <label>🔑 X-Auth:</label>
            <input type="password" id="tokenInput" placeholder="Paste your X-Authorization token here..." />
            <button class="btn" onclick="saveToken()">💾 Save</button>
            <button class="btn btn-secondary" onclick="clearToken()">✕ Clear</button>
            <span class="token-status invalid" id="tokenStatus">No token set</span>
        </div>

        <div class="footer">
            <span class="status-dot online"></span> All systems operational &bull; 2026
        </div>
    </div>

    <script>
        const TOKEN_KEY = "sn_token";

        // ─── TOKEN HANDLING ──────────────────────────────────────────────────
        function saveToken() {
            const input = document.getElementById('tokenInput');
            const token = input.value.trim();
            if (!token) {
                alert('⚠️ Please paste your X-Authorization token first!');
                return;
            }
            localStorage.setItem(TOKEN_KEY, token);
            updateUI();
            input.value = '';
            alert('✅ Token saved! Click the Shop button to enter.');
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_KEY);
            document.getElementById('tokenInput').value = '';
            updateUI();
        }

        function getToken() {
            return localStorage.getItem(TOKEN_KEY) || '';
        }

        function maskToken(token) {
            if (!token) return '';
            if (token.length <= 12) return token;
            return token.substring(0, 8) + '...' + token.substring(token.length - 6);
        }

        function updateUI() {
            const token = getToken();
            const status = document.getElementById('tokenStatus');
            const shopCard = document.getElementById('shopCard');
            const shopDesc = document.getElementById('shopDesc');
            const shopBadge = document.getElementById('shopBadge');

            if (token) {
                status.textContent = `✅ ${maskToken(token)}`;
                status.className = 'token-status valid';
                shopCard.classList.remove('disabled');
                shopDesc.textContent = '🔓 Click to open the shop — you are logged in!';
                shopBadge.textContent = '✅ Unlocked';
                shopBadge.className = 'badge shop-unlocked';
            } else {
                status.textContent = '❌ No token set';
                status.className = 'token-status invalid';
                shopCard.classList.add('disabled');
                shopDesc.textContent = '🔒 Please save your X-Authorization token below to unlock';
                shopBadge.textContent = '🔒 Locked';
                shopBadge.className = 'badge shop-locked';
            }
        }

        function openShop() {
            const token = getToken();
            if (!token) {
                alert('⚠️ Please save your X-Authorization token first!\n\nPaste it in the field below and click "Save".');
                document.getElementById('tokenInput').focus();
                return;
            }
            window.open(`https://a4yoshi.github.io/shop?token=${encodeURIComponent(token)}`, '_blank');
        }

        // ─── INIT ────────────────────────────────────────────────────────────
        // Enter key to save
        document.getElementById('tokenInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') saveToken();
        });

        // Auto-fill token if exists
        const token = getToken();
        if (token) {
            document.getElementById('tokenInput').placeholder = 'Token already saved ✓';
        }

        updateUI();
    </script>
</body>
</html>
