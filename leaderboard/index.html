<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Secret Neighbor Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            background: #16213e;
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { color: #e94560; font-size: 28px; }
        .header .stats { color: #aaa; font-size: 14px; }
        .header .stats span { color: #e94560; font-weight: bold; }

        .cache-info {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #2a2a4a;
            font-size: 13px;
            color: #888;
        }
        .cache-info .updated { color: #2ecc71; }
        .cache-info .token-status { color: #e94560; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #0f3460; }
        .btn-secondary:hover { background: #1a4a8a; }

        .table-wrap {
            background: #16213e;
            border-radius: 16px;
            border: 2px solid #2a2a4a;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #0f3460;
            color: #e94560;
            padding: 14px 18px;
            text-align: left;
            font-weight: bold;
            font-size: 14px;
        }
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #1a1a3e;
            color: #ddd;
            font-size: 14px;
        }
        tr:hover td { background: #1a2a4a; }
        .rank-1 td { color: #ffd700; font-weight: bold; }
        .rank-2 td { color: #c0c0c0; font-weight: bold; }
        .rank-3 td { color: #cd7f32; font-weight: bold; }
        .rank-number { font-weight: bold; color: #e94560; }
        .rank-1 .rank-number { color: #ffd700; }
        .rank-2 .rank-number { color: #c0c0c0; }
        .rank-3 .rank-number { color: #cd7f32; }

        .player-cell { display: flex; align-items: center; gap: 10px; }
        .player-cell img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 6px;
            background: #0f3460;
            padding: 2px;
        }
        .player-name { font-weight: 500; }
        .player-id {
            font-size: 11px;
            color: #888;
            font-family: monospace;
            margin-top: 2px;
        }
        .player-name-wrap { display: flex; flex-direction: column; }
        .banned-badge {
            background: #111;
            color: #e94560;
            border: 1px solid #e94560;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: bold;
        }
        .banned-row td { opacity: 0.7; }

        .loading { padding: 40px; text-align: center; color: #555; }
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
        .footer a { color: #e94560; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 6px 14px;
            background: #0f3460;
            color: #aaa;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .page-btn:hover { border-color: #e94560; color: white; }
        .page-btn.active { background: #e94560; color: white; border-color: #e94560; }

        .empty-state { padding: 40px; text-align: center; color: #555; }
        .empty-state .big-icon { font-size: 48px; display: block; margin-bottom: 10px; }

        .token-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .token-input-row input {
            padding: 8px 14px;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #0f3460;
            color: white;
            font-size: 13px;
            flex: 1;
            min-width: 200px;
        }
        .token-input-row input:focus { border-color: #e94560; outline: none; }
        .token-status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .token-status-dot.valid { background: #2ecc71; }
        .token-status-dot.invalid { background: #e94560; }

        /* ── FILTER TABS ── */
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        .tab-group-label {
            width: 100%;
            color: #666;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            margin-top: 8px;
        }
        .tab-group-label:first-child { margin-top: 0; }
        .filters {
            background: #16213e;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 2px solid transparent;
            background: #0f3460;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .filter-btn:hover { border-color: #e94560; color: white; }
        .filter-btn.active { background: #e94560; color: white; border-color: #e94560; }
        .filter-btn.banned-btn { border-color: #e94560; color: #e94560; }
        .filter-btn.banned-btn.active { background: #e94560; color: white; }
        .filter-btn.survivor-btn { border-color: #2ecc71; color: #2ecc71; }
        .filter-btn.survivor-btn.active { background: #2ecc71; color: #0a0a1a; border-color: #2ecc71; }
        .filter-btn.neighbor-btn { border-color: #9b59b6; color: #9b59b6; }
        .filter-btn.neighbor-btn.active { background: #9b59b6; color: white; border-color: #9b59b6; }

        .debug-log {
            background: #0a0a1a;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 12px;
            color: #888;
            max-height: 150px;
            overflow-y: auto;
        }
        .debug-log .log-info { color: #66c0f4; }
        .debug-log .log-success { color: #2ecc71; }
        .debug-log .log-error { color: #e94560; }
        .debug-log .log-warning { color: #f39c12; }

        @media (max-width: 600px) {
            .header { flex-direction: column; text-align: center; }
            .filters { flex-direction: column; }
            .controls { flex-direction: column; }
            .token-input-row input { width: 100%; }
            th, td { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>🏆 Secret Neighbor Leaderboard</h1>
        <div class="stats">
            👥 <span id="totalPlayers">0</span> players &nbsp;|&nbsp;
            📈 Top Level: <span id="topLevel">0</span>
        </div>
    </div>

    <div class="cache-info">
        <div>📦 Cache: <span class="updated" id="cacheStatus">Not loaded yet</span></div>
        <div class="token-status" id="tokenStatus">
            <span class="token-status-dot invalid" id="tokenDot"></span>
            <span id="tokenText">No token set</span>
        </div>
    </div>

    <div class="controls">
        <div class="token-input-row">
            <input type="password" id="tokenInput" placeholder="Enter X-Authorization token..." />
            <button class="btn" onclick="setToken()">🔑 Set Token</button>
            <button class="btn btn-secondary" onclick="clearToken()">✕ Clear</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="refreshLeaderboard()" id="refreshBtn">🔄 Refresh</button>
        <button class="btn btn-secondary" onclick="clearDebug()">🗑️ Clear Log</button>
    </div>

    <div class="debug-log" id="debugLog">
        <div class="log-info">📡 Ready. Enter token and click Refresh.</div>
    </div>

    <div class="filters">
        <div class="tab-group-label">🌍 Global</div>
        <div class="filter-tabs">
            <button class="filter-btn" data-filter="accountLevel" onclick="setFilter('accountLevel')">🏅 Account Level</button>
        </div>

        <div class="tab-group-label">👤 By Role</div>
        <div class="filter-tabs">
            <button class="filter-btn survivor-btn active" data-filter="survivors" onclick="setFilter('survivors')">🧒 Survivors (Best)</button>
            <button class="filter-btn survivor-btn" data-filter="survivorsAll" onclick="setFilter('survivorsAll')">🧒 Survivors (All)</button>
            <button class="filter-btn neighbor-btn" data-filter="neighbors" onclick="setFilter('neighbors')">🏠 Neighbors (Best)</button>
            <button class="filter-btn neighbor-btn" data-filter="neighborsAll" onclick="setFilter('neighborsAll')">🏠 Neighbors (All)</button>
        </div>

        <div class="tab-group-label">🎭 Characters</div>
        <div class="filter-tabs">
            <button class="filter-btn" data-filter="Bagger" onclick="setFilter('Bagger')">🎒 Bagger</button>
            <button class="filter-btn" data-filter="Brave" onclick="setFilter('Brave')">🛡️ Brave</button>
            <button class="filter-btn" data-filter="Detective" onclick="setFilter('Detective')">🔍 Detective</button>
            <button class="filter-btn" data-filter="Inventor" onclick="setFilter('Inventor')">🔧 Inventor</button>
            <button class="filter-btn" data-filter="Leader" onclick="setFilter('Leader')">⭐ Leader</button>
            <button class="filter-btn" data-filter="Quentin" onclick="setFilter('Quentin')">📰 Quentin</button>
            <button class="filter-btn" data-filter="Scout" onclick="setFilter('Scout')">🔭 Scout</button>
            <button class="filter-btn" data-filter="Neighbor" onclick="setFilter('Neighbor')">🏠 Neighbor</button>
            <button class="filter-btn" data-filter="Butcher" onclick="setFilter('Butcher')">🔪 Butcher</button>
            <button class="filter-btn" data-filter="Clown" onclick="setFilter('Clown')">🤡 Clown</button>
            <button class="filter-btn" data-filter="Ghost" onclick="setFilter('Ghost')">👻 Ghost</button>
            <button class="filter-btn" data-filter="Guest" onclick="setFilter('Guest')">🚪 Guest</button>
            <button class="filter-btn" data-filter="Hunter" onclick="setFilter('Hunter')">🧸 Hunter</button>
        </div>

        <div class="tab-group-label">🎲 Extra</div>
        <div class="filter-tabs">
            <button class="filter-btn" data-filter="RandomExplorer" onclick="setFilter('RandomExplorer')">🎲 Random Explorer</button>
            <button class="filter-btn" data-filter="RandomNeighbor" onclick="setFilter('RandomNeighbor')">🎲 Random Neighbor</button>
            <button class="filter-btn banned-btn" data-filter="Banned" onclick="setFilter('Banned')">🔨 Banned</button>
        </div>
    </div>

    <div class="table-wrap">
        <div id="tableContainer">
            <div class="loading">📦 Loading leaderboard from cache...</div>
        </div>
        <div id="paginationContainer" style="display:none;" class="pagination"></div>
    </div>

    <div class="footer">
        <a href="https://a4yoshi.github.io">← Back to a4Yoshi Tools</a> &bull; Data from PlayFab
    </div>
</div>

<script>
    // ─── CONFIG ──────────────────────────────────────────────────────────────
    const CACHE_KEY = "leaderboard_cache_v2";
    const TOKEN_KEY = "leaderboard_token";
    const PROXY = "https://sweet-credit-ba20.berenddominik026.workers.dev";
    const PLATFORM = "STEAM";

    // ─── CHARACTER STATS ─────────────────────────────────────────────────────
    const SURVIVOR_STATS = {
        "Bagger":    "LeaderBoard_BagmanSTEAM",
        "Brave":     "LeaderBoard_BraveSTEAM",
        "Detective": "LeaderBoard_DetectiveSTEAM",
        "Inventor":  "LeaderBoard_InventorSTEAM",
        "Leader":    "LeaderBoard_LeaderSTEAM",
        "Quentin":   "LeaderBoard_QuentinSTEAM",
        "Scout":     "LeaderBoard_ScoutSTEAM"
    };

    const NEIGHBOR_STATS = {
        "Neighbor": "LeaderBoard_BasicNeighborSTEAM",
        "Butcher":  "LeaderBoard_ButcherNeighborSTEAM",
        "Clown":    "LeaderBoard_ClownNeighborSTEAM",
        "Ghost":    "LeaderBoard_GhostNeighborSTEAM",
        "Guest":    "LeaderBoard_GuestNeighborSTEAM",
        "Hunter":   "LeaderBoard_HunterNeighborSTEAM"
    };

    const EXTRA_STATS = {
        "RandomExplorer": "LeaderBoard_RandomExplorerSTEAM",
        "RandomNeighbor": "LeaderBoard_RandomNeighborSTEAM"
    };

    const ACCOUNT_LEVEL_STAT = "LeaderBoard_AccountLevelSTEAM";
    const BANNED_STAT        = "Banned";

    const CHARACTER_DISPLAY = {
        "Bagger": "Bagger", "Brave": "Brave", "Detective": "Detective",
        "Inventor": "Inventor", "Leader": "Leader", "Quentin": "Quentin",
        "Scout": "Scout", "Neighbor": "Neighbor", "Butcher": "Butcher",
        "Clown": "Clown", "Ghost": "Ghost", "Guest": "Guest", "Hunter": "Hunter"
    };

    const CHARACTER_ICONS = {
        "Bagger": "bagger.png", "Brave": "brave.png", "Detective": "detective.png",
        "Inventor": "inventor.png", "Leader": "leader.png", "Quentin": "quentin.png",
        "Scout": "scout.png", "Neighbor": "neighbor.png", "Butcher": "butcher.png",
        "Clown": "clown.png", "Ghost": "ghost.png", "Guest": "guest.png", "Hunter": "hunter.png"
    };

    const SURVIVOR_KEYS  = new Set(Object.keys(SURVIVOR_STATS));
    const NEIGHBOR_KEYS  = new Set(Object.keys(NEIGHBOR_STATS));

    // ─── STATE ───────────────────────────────────────────────────────────────
    let allEntries     = {};   // keyed by view name
    let filteredEntries = [];
    let currentPage    = 1;
    const pageSize     = 50;
    let currentFilter  = "survivors";
    let userToken      = localStorage.getItem(TOKEN_KEY) || "";
    let isRefreshing   = false;

    // ─── DEBUG LOG ───────────────────────────────────────────────────────────
    function log(msg, type = 'info') {
        const logEl = document.getElementById('debugLog');
        const cls   = { info: 'log-info', success: 'log-success', error: 'log-error', warning: 'log-warning' };
        const time  = new Date().toLocaleTimeString();
        logEl.innerHTML += `<div class="${cls[type] || 'log-info'}">[${time}] ${msg}</div>`;
        logEl.scrollTop = logEl.scrollHeight;
    }
    function clearDebug() {
        document.getElementById('debugLog').innerHTML = '<div class="log-info">📡 Log cleared.</div>';
    }

    // ─── TOKEN ───────────────────────────────────────────────────────────────
    function setToken() {
        const input = document.getElementById("tokenInput");
        const token = input.value.trim();
        if (!token) { alert("⚠️ Please paste your X-Authorization token!"); return; }
        userToken = token;
        localStorage.setItem(TOKEN_KEY, token);
        updateTokenStatus();
        log("✅ Token saved! Refreshing...", 'success');
        input.value = "";
        refreshLeaderboard();
    }

    function clearToken() {
        userToken = "";
        localStorage.removeItem(TOKEN_KEY);
        updateTokenStatus();
        log("🗑️ Token cleared", 'warning');
        loadFromCache();
    }

    function updateTokenStatus() {
        const dot  = document.getElementById("tokenDot");
        const text = document.getElementById("tokenText");
        if (userToken) {
            dot.className        = "token-status-dot valid";
            text.textContent     = "Token set ✓";
            text.style.color     = "#2ecc71";
        } else {
            dot.className        = "token-status-dot invalid";
            text.textContent     = "No token set — using cache";
            text.style.color     = "#e94560";
        }
    }

    // ─── CACHE ───────────────────────────────────────────────────────────────
    function saveToCache(data) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() })); } catch (e) {}
        updateCacheStatus();
    }

    function loadFromCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) {
                document.getElementById("tableContainer").innerHTML =
                    `<div class="empty-state">📦 No cached data. Set a token and refresh.</div>`;
                return false;
            }
            const cache = JSON.parse(raw);
            allEntries = cache.data;
            filteredEntries = [...(allEntries[currentFilter] || [])];
            updateStats();
            renderTable();
            updateCacheStatus();
            log(`📦 Loaded from cache`, 'info');
            return true;
        } catch (e) { return false; }
    }

    function updateCacheStatus() {
        const status = document.getElementById("cacheStatus");
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) { status.textContent = "No cache"; status.style.color = "#e94560"; return; }
            const cache = JSON.parse(raw);
            const age   = Math.floor((Date.now() - cache.timestamp) / 60000);
            status.textContent  = `${new Date(cache.timestamp).toLocaleString()} (${age}m ago)`;
            status.style.color  = age < 60 ? "#2ecc71" : "#f39c12";
        } catch (e) { status.textContent = "Cache error"; status.style.color = "#e94560"; }
    }

    // ─── FETCH ───────────────────────────────────────────────────────────────
    async function fetchStat(statName, token) {
        try {
            const url  = `${PROXY}/${PLATFORM}/Client/GetLeaderboard?sdk=UnitySDK-2.155.221207`;
            const body = { MaxResultsCount: 100, StartPosition: 0, StatisticName: statName };
            log(`📡 Fetching ${statName}...`, 'info');

            const res = await fetch(url, {
                method: "POST",
                headers: {
                    "X-Authorization":       token,
                    "Content-Type":          "application/json",
                    "X-PlayFabSDK":          "UnitySDK-2.155.221207",
                    "X-ReportErrorAsSuccess":"true",
                    "Accept":                "*/*",
                    "X-Unity-Version":       "2022.3.14f1"
                },
                body: JSON.stringify(body)
            });

            log(`📡 Response status: ${res.status} for ${statName}`, 'info');
            if (!res.ok) { log(`❌ HTTP ${res.status} for ${statName}`, 'error'); return null; }

            const data = await res.json();
            if (data.code === 200 && data.data && data.data.Leaderboard) {
                log(`✅ ${statName}: ${data.data.Leaderboard.length} players`, 'success');
                return data.data.Leaderboard;
            } else {
                log(`⚠️ ${statName}: ${data.errorMessage || 'No data'} (code: ${data.code})`, 'warning');
                return null;
            }
        } catch (e) {
            log(`❌ ${statName} error: ${e.message}`, 'error');
            return null;
        }
    }

    // ─── BUILD DEDUPED LIST ──────────────────────────────────────────────────
    // For a given set of {charKey: [entries]}, return one entry per player
    // keeping the highest StatValue across all chars in the set.
    // charLabel: function(charKey) → display string  (null = don't show char col)
    function buildDeduped(charDataMap) {
        const playerMap = {};

        for (const [charKey, entries] of Object.entries(charDataMap)) {
            if (!entries) continue;
            for (const e of entries) {
                const id    = e.PlayFabId || e.PlayerId || "";
                const name  = e.DisplayName || id || "Anonymous";
                const level = e.StatValue   || 0;

                if (!playerMap[id]) {
                    playerMap[id] = { displayName: name, id, bestChar: charKey, bestLevel: level };
                } else {
                    // keep display name from whichever entry has one
                    if (!playerMap[id].displayName && name) playerMap[id].displayName = name;
                    if (level > playerMap[id].bestLevel) {
                        playerMap[id].bestLevel = level;
                        playerMap[id].bestChar  = charKey;
                    }
                }
            }
        }

        return Object.values(playerMap)
            .sort((a, b) => b.bestLevel - a.bestLevel)
            .map((p, i) => ({ ...p, rank: i + 1 }));
    }

    // Build per-char list (no dedup needed, one char = one board)
    function buildCharList(entries, charKey) {
        if (!entries) return [];
        return entries
            .map((e, i) => ({
                rank:        i + 1,
                id:          e.PlayFabId || e.PlayerId || "",
                displayName: e.DisplayName || e.PlayFabId || "Anonymous",
                charKey,
                bestLevel:   e.StatValue || 0,
                bestChar:    charKey
            }));
    }

    // ─── REFRESH ─────────────────────────────────────────────────────────────
    async function refreshLeaderboard() {
        if (!userToken) { alert("⚠️ Set your token first!"); return; }
        if (isRefreshing) return;
        isRefreshing = true;
        document.getElementById('refreshBtn').disabled = true;

        const container = document.getElementById("tableContainer");
        container.innerHTML = '<div class="loading">⏳ Fetching all data...</div>';
        log("🔄 Starting leaderboard refresh...", 'info');

        try {
            // Step 1: Cloud Script trigger
            log("📡 Executing Cloud Script...", 'info');
            try {
                const csRes = await fetch(`${PROXY}/${PLATFORM}/Client/ExecuteCloudScript?sdk=UnitySDK-2.155.221207`, {
                    method: "POST",
                    headers: {
                        "X-Authorization": userToken, "Content-Type": "application/json",
                        "X-PlayFabSDK": "UnitySDK-2.155.221207", "X-ReportErrorAsSuccess": "true",
                        "Accept": "*/*", "X-Unity-Version": "2022.3.14f1"
                    },
                    body: JSON.stringify({
                        FunctionName: "refreshLeaderboardPlatform",
                        FunctionParameter: {
                            currentLevelProgression: {
                                playerLevel: "56",
                                classLevel: [
                                    { classId: "Bagman",  XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 0 },
                                    { classId: "Brave",   XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 1 },
                                    { classId: "Steam",   XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 1 },
                                    { classId: "Team",    XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 2 }
                                ]
                            },
                            platformName: PLATFORM
                        },
                        GeneratePlayStreamEvent: true,
                        RevisionSelection: null,
                        SpecificRevision: null
                    })
                });
                const csData = await csRes.json();
                log(`✅ Cloud Script: ${csData.code}`, csData.code === 200 ? 'success' : 'warning');
            } catch (e) {
                log(`⚠️ Cloud Script failed: ${e.message}`, 'warning');
            }

            // Step 2: Fetch all survivor stats
            const survivorData = {};
            for (const [key, stat] of Object.entries(SURVIVOR_STATS)) {
                survivorData[key] = await fetchStat(stat, userToken);
                container.innerHTML = `<div class="loading">⏳ Fetching survivors... (${key})</div>`;
            }

            // Step 3: Fetch all neighbor stats
            const neighborData = {};
            for (const [key, stat] of Object.entries(NEIGHBOR_STATS)) {
                neighborData[key] = await fetchStat(stat, userToken);
                container.innerHTML = `<div class="loading">⏳ Fetching neighbors... (${key})</div>`;
            }

            // Step 4: Fetch extra stats
            const extraData = {};
            for (const [key, stat] of Object.entries(EXTRA_STATS)) {
                extraData[key] = await fetchStat(stat, userToken);
            }

            // Step 5: Fetch Account Level
            container.innerHTML = `<div class="loading">⏳ Fetching account levels...</div>`;
            const accountLevelRaw = await fetchStat(ACCOUNT_LEVEL_STAT, userToken);

            // Step 6: Fetch Banned (may 400 — that's ok, we catch it)
            const bannedRaw = await fetchStat(BANNED_STAT, userToken);

            // ── Build views ──────────────────────────────────────────────────

            // Survivors best: one entry per player, best survivor char
            const survivorsList = buildDeduped(survivorData);

            // Neighbors best: one entry per player, best neighbor char
            const neighborsList = buildDeduped(neighborData);

            // Account level: one entry per player
            const accountList = buildCharList(accountLevelRaw || [], "AccountLevel");

            // Per-character views
            const charViews = {};
            for (const [key, raw] of Object.entries(survivorData))
                charViews[key] = buildCharList(raw || [], key);
            for (const [key, raw] of Object.entries(neighborData))
                charViews[key] = buildCharList(raw || [], key);

            // Extra views
            const extraViews = {};
            for (const [key, raw] of Object.entries(extraData))
                extraViews[key] = buildCharList(raw || [], key);

            // Banned view
            const bannedList = bannedRaw
                ? bannedRaw.map((e, i) => ({
                    rank: i + 1,
                    id:          e.PlayFabId || e.PlayerId || "",
                    displayName: e.DisplayName || e.PlayFabId || "Unknown",
                    charKey:     "Banned",
                    bestChar:    "Banned",
                    bestLevel:   e.StatValue || 0
                  }))
                : [];

            // Survivors All: every char entry, player can appear multiple times
            const survivorsAll = Object.entries(survivorData)
                .flatMap(([key, raw]) => buildCharList(raw || [], key))
                .sort((a, b) => b.bestLevel - a.bestLevel)
                .map((e, i) => ({ ...e, rank: i + 1 }));

            // Neighbors All: same
            const neighborsAll = Object.entries(neighborData)
                .flatMap(([key, raw]) => buildCharList(raw || [], key))
                .sort((a, b) => b.bestLevel - a.bestLevel)
                .map((e, i) => ({ ...e, rank: i + 1 }));

            allEntries = {
                accountLevel: accountList,
                survivors:    survivorsList,
                survivorsAll: survivorsAll,
                neighbors:    neighborsList,
                neighborsAll: neighborsAll,
                ...charViews,
                ...extraViews,
                Banned:       bannedList
            };

            log(`✅ Done — Survivors: ${survivorsList.length}, Neighbors: ${neighborsList.length}, Account: ${accountList.length}`, 'success');

            saveToCache(allEntries);
            setFilter(currentFilter, true);
            updateStats();
            updateCacheStatus();

        } catch (e) {
            log(`❌ Fatal: ${e.message}`, 'error');
            container.innerHTML = `<div class="empty-state" style="color:#e94560;">⚠️ Error: ${e.message}</div>`;
        } finally {
            isRefreshing = false;
            document.getElementById('refreshBtn').disabled = false;
        }
    }

    // ─── FILTERS ─────────────────────────────────────────────────────────────
    function setFilter(filter, skipRender = false) {
        currentFilter = filter;

        document.querySelectorAll('[data-filter]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === filter);
        });

        filteredEntries = [...(allEntries[filter] || [])];
        currentPage = 1;
        if (!skipRender) renderTable();
        log(`📊 Filter: ${filter} — ${filteredEntries.length} entries`, 'info');
    }

    // ─── RENDER ──────────────────────────────────────────────────────────────
    function renderTable() {
        const container   = document.getElementById('tableContainer');
        const pagCont     = document.getElementById('paginationContainer');

        if (!filteredEntries || filteredEntries.length === 0) {
            container.innerHTML = `<div class="empty-state"><span class="big-icon">🔍</span>No data for this view.</div>`;
            pagCont.style.display = 'none';
            return;
        }

        const isExtra  = ["RandomExplorer", "RandomNeighbor"].includes(currentFilter);
        const isBanned = currentFilter === "Banned";
        const showChar = ["survivors", "survivorsAll", "neighbors", "neighborsAll"].includes(currentFilter);
        const isAccountLevel = currentFilter === "accountLevel";

        const totalPages = Math.ceil(filteredEntries.length / pageSize);
        const start = (currentPage - 1) * pageSize;
        const pageEntries = filteredEntries.slice(start, start + pageSize);

        // decide columns
        let headers = `<th>#</th><th>Player</th>`;
        if (showChar)        headers += `<th>Best Character</th>`;
        if (!isAccountLevel) headers += `<th>Level</th>`;
        if (isAccountLevel)  headers += `<th>Account Level</th>`;

        let html = `<table><thead><tr>${headers}</tr></thead><tbody>`;

        pageEntries.forEach((entry, idx) => {
            const rank      = start + idx + 1;
            const rankClass = rank <= 3 ? `rank-${rank}` : '';
            const isBannedEntry = isBanned || entry.charKey === "Banned";

            // name display
            const name = entry.displayName || entry.id || "Unknown";
            const icon = isBannedEntry ? 'default.png' : (CHARACTER_ICONS[entry.bestChar] || 'default.png');

            // for extra + banned: show name + id underneath
            const showId = isExtra || isBannedEntry;

            const playerCell = `
                <div class="player-cell">
                    <img src="images/characters/${icon}" onerror="this.style.display='none'"/>
                    <div class="player-name-wrap">
                        <span class="player-name">${isBannedEntry ? (name !== entry.id ? name : "Unknown") : name}</span>
                        ${showId ? `<span class="player-id">${entry.id}</span>` : ''}
                    </div>
                    ${isBannedEntry ? '<span class="banned-badge">🔨 BANNED</span>' : ''}
                </div>`;

            const charDisplay = CHARACTER_DISPLAY[entry.bestChar] || entry.bestChar || "—";

            html += `<tr class="${rankClass}${isBannedEntry ? ' banned-row' : ''}">
                <td class="rank-number">#${rank}</td>
                <td>${playerCell}</td>
                ${showChar ? `<td>${isBannedEntry ? '<span style="color:#e94560;">BANNED</span>' : charDisplay}</td>` : ''}
                <td>${entry.bestLevel ?? 0}</td>
            </tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

        if (totalPages > 1) {
            pagCont.style.display = 'flex';
            let pHtml = '';
            const maxVisible = 10;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage   = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);

            if (startPage > 1)         pHtml += `<button class="page-btn" onclick="goToPage(1)">«</button>`;
            for (let i = startPage; i <= endPage; i++)
                pHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            if (endPage < totalPages)  pHtml += `<button class="page-btn" onclick="goToPage(${totalPages})">»</button>`;

            pagCont.innerHTML = pHtml;
        } else {
            pagCont.style.display = 'none';
        }
    }

    function goToPage(page) { currentPage = page; renderTable(); }

    function updateStats() {
        const list = allEntries[currentFilter] || allEntries["survivors"] || [];
        document.getElementById('totalPlayers').textContent = list.length;
        document.getElementById('topLevel').textContent     = list.length > 0 ? list[0].bestLevel : 0;
    }

    // ─── INIT ────────────────────────────────────────────────────────────────
    function init() {
        updateTokenStatus();
        const hasCache = loadFromCache();
        if (userToken && !hasCache) {
            log("🔑 Token found, auto-refreshing...", 'info');
            refreshLeaderboard();
        } else if (!userToken) {
            log("📡 Ready. Enter token and click Refresh.", 'info');
        }
    }

    init();
</script>
</body>
</html>
