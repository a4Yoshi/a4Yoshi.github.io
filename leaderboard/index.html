<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Secret Neighbor Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            background: #16213e;
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            color: #e94560;
            font-size: 28px;
        }
        .header .stats {
            color: #aaa;
            font-size: 14px;
        }
        .header .stats span { color: #e94560; font-weight: bold; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover { background: #1a4a8a; }
        .search-box {
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #16213e;
            color: white;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        .search-box:focus { border-color: #e94560; outline: none; }
        .table-wrap {
            background: #16213e;
            border-radius: 16px;
            border: 2px solid #2a2a4a;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #0f3460;
            color: #e94560;
            padding: 14px 18px;
            text-align: left;
            font-weight: bold;
            font-size: 14px;
        }
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #1a1a3e;
            color: #ddd;
            font-size: 14px;
        }
        tr:hover td { background: #1a2a4a; }
        .rank-1 td { color: #ffd700; font-weight: bold; }
        .rank-2 td { color: #c0c0c0; font-weight: bold; }
        .rank-3 td { color: #cd7f32; font-weight: bold; }
        .rank-number { font-weight: bold; color: #e94560; }
        .rank-1 .rank-number { color: #ffd700; }
        .rank-2 .rank-number { color: #c0c0c0; }
        .rank-3 .rank-number { color: #cd7f32; }
        .you-badge {
            background: #e94560;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: bold;
        }
        .loading {
            padding: 40px;
            text-align: center;
            color: #555;
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
        .footer a {
            color: #e94560;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
        }
        .page-btn {
            padding: 6px 14px;
            background: #0f3460;
            color: #aaa;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .page-btn:hover { border-color: #e94560; color: white; }
        .page-btn.active { background: #e94560; color: white; border-color: #e94560; }
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 13px;
        }
        .auto-refresh input { cursor: pointer; }
        @media (max-width: 600px) {
            .header { flex-direction: column; text-align: center; }
            .controls { flex-direction: column; }
            .search-box { width: 100%; }
            th, td { padding: 10px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Leaderboard</h1>
            <div class="stats">
                👥 <span id="totalPlayers">0</span> players &nbsp;|&nbsp;
                📈 Top Level: <span id="topLevel">0</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="refreshLeaderboard()" id="refreshBtn">🔄 Refresh</button>
            <button class="btn btn-secondary" onclick="resetSearch()">✕ Clear</button>
            <input class="search-box" id="searchBox" placeholder="🔍 Search player..." oninput="filterTable()"/>
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" checked/>
                <label for="autoRefresh">Auto-refresh (30s)</label>
            </div>
        </div>

        <div class="table-wrap">
            <div id="tableContainer">
                <div class="loading">Loading leaderboard...</div>
            </div>
            <div id="paginationContainer" style="display:none;"></div>
        </div>

        <div class="footer">
            <a href="https://a4yoshi.github.io">← Back to a4Yoshi Tools</a> &bull; Data from PlayFab
        </div>
    </div>

    <script>
        const HOST = "https://bdff1.playfabapi.com";
        const STAT_NAME = "LeaderBoard_AccountLevelSTEAM";
        let allEntries = [];
        let filteredEntries = [];
        let currentPage = 1;
        const pageSize = 25;

        async function loadLeaderboard() {
            const container = document.getElementById('tableContainer');
            container.innerHTML = '<div class="loading">Loading leaderboard...</div>';

            try {
                const res = await fetch(`${HOST}/Client/GetLeaderboard`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        MaxResultsCount: 100,
                        StartPosition: 0,
                        StatisticName: STAT_NAME
                    })
                });

                const data = await res.json();
                if (data.code === 200 && data.data && data.data.Leaderboard) {
                    allEntries = data.data.Leaderboard;
                    filteredEntries = [...allEntries];
                    renderTable();
                    updateStats();
                } else {
                    container.innerHTML = `<div class="loading" style="color:#e94560;">⚠️ Could not load leaderboard: ${data.errorMessage || 'Unknown error'}</div>`;
                }
            } catch (e) {
                container.innerHTML = `<div class="loading" style="color:#e94560;">⚠️ Network error: ${e.message}</div>`;
            }
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            const paginationContainer = document.getElementById('paginationContainer');

            if (!filteredEntries || filteredEntries.length === 0) {
                container.innerHTML = '<div class="loading">No players found</div>';
                paginationContainer.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(filteredEntries.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, filteredEntries.length);
            const pageEntries = filteredEntries.slice(start, end);

            let html = `<table>
                <thead><tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>Level</th>
                    <th>Position</th>
                </tr></thead><tbody>`;

            pageEntries.forEach((entry, idx) => {
                const rank = start + idx + 1;
                const rankClass = rank <= 3 ? `rank-${rank}` : '';
                const displayName = entry.DisplayName || entry.PlayFabId || 'Anonymous';
                const level = entry.StatValue || 0;
                html += `
                    <tr class="${rankClass}">
                        <td class="rank-number">#${rank}</td>
                        <td>${displayName}</td>
                        <td>${level}</td>
                        <td>${entry.Position !== undefined ? `#${entry.Position + 1}` : '-'}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;

            // Pagination
            if (totalPages > 1) {
                paginationContainer.style.display = 'flex';
                let pHtml = '';
                for (let i = 1; i <= totalPages; i++) {
                    pHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
                paginationContainer.innerHTML = pHtml;
            } else {
                paginationContainer.style.display = 'none';
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderTable();
        }

        function updateStats() {
            document.getElementById('totalPlayers').textContent = allEntries.length;
            const maxLevel = allEntries.reduce((max, e) => Math.max(max, e.StatValue || 0), 0);
            document.getElementById('topLevel').textContent = maxLevel;
        }

        function filterTable() {
            const query = document.getElementById('searchBox').value.toLowerCase().trim();
            if (!query) {
                filteredEntries = [...allEntries];
            } else {
                filteredEntries = allEntries.filter(e => {
                    const name = (e.DisplayName || e.PlayFabId || '').toLowerCase();
                    return name.includes(query);
                });
            }
            currentPage = 1;
            renderTable();
        }

        function resetSearch() {
            document.getElementById('searchBox').value = '';
            filterTable();
        }

        async function refreshLeaderboard() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Loading...';
            await loadLeaderboard();
            btn.disabled = false;
            btn.textContent = '🔄 Refresh';
        }

        // Auto-refresh
        let refreshInterval = null;
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                if (document.getElementById('autoRefresh').checked) {
                    loadLeaderboard();
                }
            }, 30000);
        }

        // Init
        loadLeaderboard();
        startAutoRefresh();

        // Toggle auto-refresh on checkbox change
        document.getElementById('autoRefresh').addEventListener('change', () => {
            if (document.getElementById('autoRefresh').checked) {
                startAutoRefresh();
            } else {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                    refreshInterval = null;
                }
            }
        });
    </script>
</body>
</html>
