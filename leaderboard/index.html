<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Secret Neighbor Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #16213e;
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            color: #e94560;
            font-size: 28px;
        }
        .header .stats {
            color: #aaa;
            font-size: 14px;
        }
        .header .stats span { color: #e94560; font-weight: bold; }

        .cache-info {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #2a2a4a;
            font-size: 13px;
            color: #888;
        }
        .cache-info .updated { color: #2ecc71; }
        .cache-info .token-status { color: #e94560; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover { background: #1a4a8a; }

        .table-wrap {
            background: #16213e;
            border-radius: 16px;
            border: 2px solid #2a2a4a;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #0f3460;
            color: #e94560;
            padding: 14px 18px;
            text-align: left;
            font-weight: bold;
            font-size: 14px;
        }
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #1a1a3e;
            color: #ddd;
            font-size: 14px;
        }
        tr:hover td { background: #1a2a4a; }

        .rank-1 td { color: #ffd700; font-weight: bold; }
        .rank-2 td { color: #c0c0c0; font-weight: bold; }
        .rank-3 td { color: #cd7f32; font-weight: bold; }

        .rank-number { font-weight: bold; color: #e94560; }
        .rank-1 .rank-number { color: #ffd700; }
        .rank-2 .rank-number { color: #c0c0c0; }
        .rank-3 .rank-number { color: #cd7f32; }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-cell img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 6px;
            background: #0f3460;
            padding: 2px;
        }
        .player-name { font-weight: 500; }
        .you-badge {
            background: #e94560;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: bold;
        }
        .banned-badge {
            background: #111;
            color: #e94560;
            border: 1px solid #e94560;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: bold;
        }
        .banned-row td { opacity: 0.7; }
        .stat-name {
            font-size: 10px;
            color: #555;
            display: block;
            margin-top: 2px;
        }
        .empty-badge {
            color: #555;
            font-size: 10px;
            padding: 2px 8px;
            border: 1px solid #333;
            border-radius: 10px;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #555;
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
        .footer a {
            color: #e94560;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 6px 14px;
            background: #0f3460;
            color: #aaa;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .page-btn:hover { border-color: #e94560; color: white; }
        .page-btn.active { background: #e94560; color: white; border-color: #e94560; }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #555;
        }
        .empty-state .big-icon { font-size: 48px; display: block; margin-bottom: 10px; }

        .token-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .token-input-row input {
            padding: 8px 14px;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #0f3460;
            color: white;
            font-size: 13px;
            flex: 1;
            min-width: 200px;
        }
        .token-input-row input:focus { border-color: #e94560; outline: none; }
        .token-status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .token-status-dot.valid { background: #2ecc71; }
        .token-status-dot.invalid { background: #e94560; }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #16213e;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .filter-group-label {
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            margin-right: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .filter-btn {
            padding: 5px 12px;
            border-radius: 16px;
            border: 2px solid transparent;
            background: #0f3460;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .filter-btn:hover { border-color: #e94560; color: white; }
        .filter-btn.active {
            background: #e94560;
            color: white;
            border-color: #e94560;
        }
        .filter-btn.banned-btn {
            border-color: #e94560;
            color: #e94560;
        }
        .filter-btn.banned-btn.active {
            background: #e94560;
            color: white;
        }
        .filter-btn.banned-btn.has-data { border-color: #2ecc71; color: #2ecc71; }
        .filter-btn.banned-btn.has-data.active { background: #2ecc71; color: #000; }
        .filter-btn.banned-btn.no-data { border-color: #555; color: #555; }
        .filter-divider {
            width: 1px;
            height: 30px;
            background: #2a2a4a;
            margin: 0 8px;
        }

        .banned-stats-info {
            font-size: 11px;
            color: #555;
            padding: 5px 12px;
            background: #0a0a1a;
            border-radius: 6px;
            display: inline-block;
        }
        .banned-stats-info .count { color: #e94560; font-weight: bold; }
        .banned-stats-info .count.green { color: #2ecc71; }

        @media (max-width: 600px) {
            .header { flex-direction: column; text-align: center; }
            .filters { flex-direction: column; }
            .filter-group { flex-wrap: wrap; }
            .controls { flex-direction: column; }
            .token-input-row input { width: 100%; }
            th, td { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>🏆 Steam Leaderboard</h1>
        <div class="stats">
            👥 <span id="totalPlayers">0</span> players &nbsp;|&nbsp;
            📈 Top Level: <span id="topLevel">0</span>
        </div>
    </div>

    <div class="cache-info">
        <div>
            📦 Cache: <span class="updated" id="cacheStatus">Not loaded yet</span>
        </div>
        <div class="token-status" id="tokenStatus">
            <span class="token-status-dot invalid" id="tokenDot"></span>
            <span id="tokenText">No token set</span>
        </div>
    </div>

    <div class="controls">
        <div class="token-input-row">
            <input type="password" id="tokenInput" placeholder="Enter X-Authorization token..." />
            <button class="btn" id="tokenBtn" onclick="setToken()">🔑 Set Token</button>
            <button class="btn btn-secondary" onclick="clearToken()">✕ Clear</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="refreshLeaderboard()" id="refreshBtn">🔄 Refresh</button>
        <span class="banned-stats-info" id="bannedStatsInfo">📊 Click a banned tab to test</span>
    </div>

    <div class="filters">
        <div class="filter-group">
            <span class="filter-group-label">👤 Character</span>
            <button class="filter-btn active" data-character="all" onclick="setCharacter('all')">👥 All</button>
            <button class="filter-btn" data-character="Bagger" onclick="setCharacter('Bagger')">🎒 Bagger</button>
            <button class="filter-btn" data-character="Brave" onclick="setCharacter('Brave')">🛡️ Brave</button>
            <button class="filter-btn" data-character="Detective" onclick="setCharacter('Detective')">🔍 Detective</button>
            <button class="filter-btn" data-character="Inventor" onclick="setCharacter('Inventor')">🔧 Inventor</button>
            <button class="filter-btn" data-character="Leader" onclick="setCharacter('Leader')">⭐ Leader</button>
            <button class="filter-btn" data-character="Quentin" onclick="setCharacter('Quentin')">📰 Quentin</button>
            <button class="filter-btn" data-character="Scout" onclick="setCharacter('Scout')">🔭 Scout</button>
            <button class="filter-btn" data-character="Neighbor" onclick="setCharacter('Neighbor')">🏠 Neighbor</button>
            <button class="filter-btn" data-character="Butcher" onclick="setCharacter('Butcher')">🔪 Butcher</button>
            <button class="filter-btn" data-character="Clown" onclick="setCharacter('Clown')">🤡 Clown</button>
            <button class="filter-btn" data-character="Ghost" onclick="setCharacter('Ghost')">👻 Ghost</button>
            <button class="filter-btn" data-character="Guest" onclick="setCharacter('Guest')">🚪 Guest</button>
            <button class="filter-btn" data-character="Hunter" onclick="setCharacter('Hunter')">🧸 Hunter</button>
        </div>

        <div class="filter-divider"></div>

        <div class="filter-group">
            <span class="filter-group-label">🎲 Random</span>
            <button class="filter-btn" data-character="RandomExplorer" onclick="setCharacter('RandomExplorer')">🎲 Random Explorer</button>
            <button class="filter-btn" data-character="RandomNeighbor" onclick="setCharacter('RandomNeighbor')">🎲 Random Neighbor</button>
        </div>

        <div class="filter-divider"></div>

        <div class="filter-group">
            <span class="filter-group-label">🔨 Banned</span>
            <button class="filter-btn banned-btn" data-character="BANNED_ALL" onclick="setCharacter('BANNED_ALL')">🔨 All Banned</button>
            <button class="filter-btn banned-btn" data-character="BANNED_V1" onclick="setCharacter('BANNED_V1')">v1: BannedSTEAM</button>
            <button class="filter-btn banned-btn" data-character="BANNED_V2" onclick="setCharacter('BANNED_V2')">v2: BANNEDSTEAM</button>
            <button class="filter-btn banned-btn" data-character="BANNED_V3" onclick="setCharacter('BANNED_V3')">v3: Banned</button>
        </div>
    </div>

    <div class="table-wrap">
        <div id="tableContainer">
            <div class="loading">📦 Loading leaderboard from cache...</div>
        </div>
        <div id="paginationContainer" style="display:none;"></div>
    </div>

    <div class="footer">
        <a href="https://a4yoshi.github.io">← Back to a4Yoshi Tools</a> &bull; Data from PlayFab
    </div>
</div>

<script>
    // ─── CONFIG ──────────────────────────────────────────────────────────────
    const CACHE_KEY = "leaderboard_cache";
    const TOKEN_KEY = "leaderboard_token";
    const PROXY = "https://sweet-credit-ba20.berenddominik026.workers.dev";
    const PLATFORM = "STEAM";
    const STAT_NAME = "LeaderBoard_AccountLevelSTEAM";

    // ─── CHARACTER MAPPING ──────────────────────────────────────────────────
    const CHARACTER_LIST = [
        "Bagger",
        "Brave",
        "Detective",
        "Inventor",
        "Leader",
        "Quentin",
        "Scout",
        "Neighbor",
        "Butcher",
        "Clown",
        "Ghost",
        "Guest",
        "Hunter"
    ];

    const CHARACTER_DISPLAY = {
        "Bagger": "Bagger",
        "Brave": "Brave",
        "Detective": "Detective",
        "Inventor": "Inventor",
        "Leader": "Leader",
        "Quentin": "Quentin",
        "Scout": "Scout",
        "Neighbor": "Neighbor",
        "Butcher": "Butcher",
        "Clown": "Clown",
        "Ghost": "Ghost",
        "Guest": "Guest",
        "Hunter": "Hunter"
    };

    const CHARACTER_ICONS = {
        "Bagger": "bagger.png",
        "Brave": "brave.png",
        "Detective": "detective.png",
        "Inventor": "inventor.png",
        "Leader": "leader.png",
        "Quentin": "quentin.png",
        "Scout": "scout.png",
        "Neighbor": "neighbor.png",
        "Butcher": "butcher.png",
        "Clown": "clown.png",
        "Ghost": "ghost.png",
        "Guest": "guest.png",
        "Hunter": "hunter.png"
    };

    // Banned variations to test
    const BANNED_VARIANTS = [
        { key: "BANNED_V1", stat: "LeaderBoard_BannedSTEAM", label: "BannedSTEAM" },
        { key: "BANNED_V2", stat: "LeaderBoard_BANNEDSTEAM", label: "BANNEDSTEAM" },
        { key: "BANNED_V3", stat: "LeaderBoard_Banned", label: "Banned" }
    ];

    // Random stats
    const RANDOM_STATS = [
        { key: "RandomExplorer", stat: "LeaderBoard_RandomExplorerSTEAM", label: "Random Explorer" },
        { key: "RandomNeighbor", stat: "LeaderBoard_RandomNeighborSTEAM", label: "Random Neighbor" }
    ];

    // ─── STATE ──────────────────────────────────────────────────────────────
    let allEntries = [];
    let filteredEntries = [];
    let currentPage = 1;
    const pageSize = 50;
    let currentCharacter = "all";
    let userToken = localStorage.getItem(TOKEN_KEY) || "";
    let isRefreshing = false;
    let bannedData = {};
    let randomData = {};

    // ─── TOKEN HANDLING ─────────────────────────────────────────────────────
    function setToken() {
        const input = document.getElementById("tokenInput");
        const token = input.value.trim();
        if (!token) {
            alert("Please enter a token!");
            return;
        }
        userToken = token;
        localStorage.setItem(TOKEN_KEY, token);
        updateTokenStatus();
        refreshLeaderboard();
        input.value = "";
    }

    function clearToken() {
        userToken = "";
        localStorage.removeItem(TOKEN_KEY);
        updateTokenStatus();
        loadFromCache();
    }

    function updateTokenStatus() {
        const dot = document.getElementById("tokenDot");
        const text = document.getElementById("tokenText");
        if (userToken) {
            dot.className = "token-status-dot valid";
            text.textContent = "Token set ✓";
            text.style.color = "#2ecc71";
        } else {
            dot.className = "token-status-dot invalid";
            text.textContent = "No token set — using cache";
            text.style.color = "#e94560";
        }
    }

    // ─── CACHE HANDLING ──────────────────────────────────────────────────────
    function saveToCache(data, character) {
        const cache = {
            data: data,
            character: character,
            timestamp: Date.now()
        };
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
        } catch (e) {}
        updateCacheStatus();
    }

    function loadFromCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) {
                document.getElementById("tableContainer").innerHTML = `
                    <div class="empty-state">📦 No cached data available. Please set a token and refresh.</div>
                `;
                return false;
            }
            const cache = JSON.parse(raw);
            allEntries = cache.data;
            filteredEntries = [...allEntries];
            currentCharacter = cache.character || "all";
            updateStats();
            renderTable();
            updateCacheStatus();
            updateFiltersUI();
            return true;
        } catch (e) {
            return false;
        }
    }

    function updateCacheStatus() {
        const status = document.getElementById("cacheStatus");
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) {
                status.textContent = "No cache";
                status.style.color = "#e94560";
                return;
            }
            const cache = JSON.parse(raw);
            const date = new Date(cache.timestamp);
            const age = Math.floor((Date.now() - cache.timestamp) / 60000);
            status.textContent = `${date.toLocaleString()} (${age}m ago) — 💾 Permanent cache`;
            status.style.color = age < 60 ? "#2ecc71" : age < 1440 ? "#f39c12" : "#e94560";
        } catch (e) {
            status.textContent = "Cache error";
            status.style.color = "#e94560";
        }
    }

    // ─── FETCH SPECIFIC STAT ────────────────────────────────────────────────
    async function fetchStat(server, statName, token) {
        try {
            const body = {
                MaxResultsCount: 50,
                StartPosition: 0,
                StatisticName: statName
            };

            const response = await fetch(`${server}/Client/GetLeaderboard?sdk=UnitySDK-2.155.221207`, {
                method: "POST",
                headers: {
                    "X-Authorization": token,
                    "Content-Type": "application/json",
                    "X-PlayFabSDK": "UnitySDK-2.155.221207",
                    "X-ReportErrorAsSuccess": "true",
                    "Accept": "*/*",
                    "X-Unity-Version": "2022.3.14f1"
                },
                body: JSON.stringify(body)
            });

            const data = await response.json();
            if (data.code === 200 && data.data && data.data.Leaderboard) {
                return data.data.Leaderboard;
            }
            return null;
        } catch (e) {
            console.log(`⚠️ Failed to fetch ${statName}:`, e.message);
            return null;
        }
    }

    // ─── FETCH LEADERBOARD ──────────────────────────────────────────────────
    async function fetchLeaderboard() {
        if (!userToken) {
            alert("⚠️ Please set your X-Authorization token first!");
            return null;
        }

        if (isRefreshing) return null;
        isRefreshing = true;

        const container = document.getElementById("tableContainer");
        container.innerHTML = '<div class="loading">⏳ Fetching leaderboard...</div>';

        try {
            const server = `${PROXY}/${PLATFORM}`;
            const allResults = [];
            const seenPlayers = new Set();
            bannedData = {};
            randomData = {};

            // ─── STEP 1: Refresh Cloud Script ──────────────────────────────
            const currentLevelProgression = {
                playerLevel: "56",
                classLevel: [
                    { classId: "Bagman", XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 0 },
                    { classId: "Brave", XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 1 },
                    { classId: "Steam", XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 1 },
                    { classId: "Team", XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 2 }
                ]
            };

            const cloudScriptBody = {
                FunctionName: "refreshLeaderboardPlatform",
                FunctionParameter: {
                    currentLevelProgression: currentLevelProgression,
                    platformName: PLATFORM
                },
                GeneratePlayStreamEvent: true,
                RevisionSelection: null,
                SpecificRevision: null
            };

            console.log("📡 Executing Cloud Script...");
            await fetch(`${server}/Client/ExecuteCloudScript?sdk=UnitySDK-2.155.221207`, {
                method: "POST",
                headers: {
                    "X-Authorization": userToken,
                    "Content-Type": "application/json",
                    "X-PlayFabSDK": "UnitySDK-2.155.221207",
                    "X-ReportErrorAsSuccess": "true",
                    "Accept": "*/*",
                    "X-Unity-Version": "2022.3.14f1"
                },
                body: JSON.stringify(cloudScriptBody)
            });

            // ─── STEP 2: Fetch Main Leaderboard ────────────────────────────
            console.log(`📡 Fetching main: ${STAT_NAME}`);
            const mainData = await fetchStat(server, STAT_NAME, userToken);
            
            if (mainData) {
                mainData.forEach(entry => {
                    const displayName = entry.DisplayName || "";
                    const isBanned = !displayName || displayName.trim() === "";
                    const playerId = entry.PlayFabId || entry.PlayerId || "";

                    if (seenPlayers.has(playerId)) return;
                    seenPlayers.add(playerId);

                    let character = "Unknown";
                    for (const charKey of CHARACTER_LIST) {
                        const display = CHARACTER_DISPLAY[charKey];
                        if (displayName.includes(charKey) || displayName.includes(display)) {
                            character = charKey;
                            break;
                        }
                    }

                    // Only mark as BANNED if it's actually banned
                    // Don't mark unknown as banned
                    if (isBanned) {
                        character = "BANNED";
                    }

                    allResults.push({
                        PlayFabId: playerId,
                        PlayerId: playerId,
                        displayName: isBanned ? (playerId || "Banned Player") : displayName,
                        character: character,
                        characterDisplay: character === "BANNED" ? "BANNED" : (CHARACTER_DISPLAY[character] || character),
                        platform: PLATFORM,
                        StatValue: entry.StatValue || 0,
                        isBanned: isBanned,
                        Position: entry.Position || 0,
                        source: "main"
                    });
                });
            }

            console.log(`✅ Main: ${allResults.length} players`);

            // ─── STEP 3: Fetch Random Stats ─────────────────────────────────
            for (const random of RANDOM_STATS) {
                console.log(`📡 Fetching random: ${random.stat}`);
                const data = await fetchStat(server, random.stat, userToken);
                const results = [];
                
                if (data && data.length > 0) {
                    data.forEach(entry => {
                        const playerId = entry.PlayFabId || entry.PlayerId || "";
                        if (!seenPlayers.has(playerId)) {
                            seenPlayers.add(playerId);
                            results.push({
                                PlayFabId: playerId,
                                PlayerId: playerId,
                                displayName: entry.DisplayName || playerId || "Anonymous",
                                character: random.key,
                                characterDisplay: random.label,
                                platform: PLATFORM,
                                StatValue: entry.StatValue || 0,
                                isBanned: false,
                                Position: entry.Position || 0,
                                source: random.key
                            });
                        }
                    });
                }
                randomData[random.key] = results;
                allResults.push(...results);
                console.log(`✅ ${random.stat}: ${results.length} players`);
            }

            // ─── STEP 4: Fetch Banned Variants ──────────────────────────────
            for (const variant of BANNED_VARIANTS) {
                console.log(`📡 Fetching banned: ${variant.stat}`);
                const data = await fetchStat(server, variant.stat, userToken);
                const results = [];
                
                if (data && data.length > 0) {
                    data.forEach(entry => {
                        const playerId = entry.PlayFabId || entry.PlayerId || "";
                        // Only add if not already seen (avoid duplicates)
                        if (!seenPlayers.has(playerId)) {
                            seenPlayers.add(playerId);
                            results.push({
                                PlayFabId: playerId,
                                PlayerId: playerId,
                                displayName: playerId || "Banned Player",
                                character: variant.key,
                                characterDisplay: `BANNED (${variant.label})`,
                                platform: PLATFORM,
                                StatValue: entry.StatValue || 0,
                                isBanned: true,
                                Position: entry.Position || 0,
                                source: variant.key,
                                statName: variant.stat
                            });
                        }
                    });
                }
                bannedData[variant.key] = results;
                allResults.push(...results);
                console.log(`✅ ${variant.stat}: ${results.length} players`);
            }

            // ─── Log summary ─────────────────────────────────────────────────
            console.log("📊 Summary:");
            for (const variant of BANNED_VARIANTS) {
                const count = bannedData[variant.key] ? bannedData[variant.key].length : 0;
                console.log(`   ${variant.label}: ${count} players`);
            }
            for (const random of RANDOM_STATS) {
                const count = randomData[random.key] ? randomData[random.key].length : 0;
                console.log(`   ${random.label}: ${count} players`);
            }
            console.log(`✅ Total: ${allResults.length} players`);

            // ─── SORT BY LEVEL (highest first) ─────────────────────────────
            allResults.sort((a, b) => (b.StatValue || 0) - (a.StatValue || 0));

            // Add rank
            allResults.forEach((entry, idx) => {
                entry.rank = idx + 1;
            });

            saveToCache(allResults, currentCharacter);
            allEntries = allResults;
            filteredEntries = [...allResults];
            updateStats();
            renderTable();
            updateCacheStatus();
            updateBannedInfo();
            return allResults;

        } catch (e) {
            container.innerHTML = `
                <div class="empty-state" style="color:#e94560;">
                    ⚠️ Network error: ${e.message}<br>
                    <span style="font-size:12px;color:#555;">Check your connection and try again</span>
                </div>
            `;
            return null;
        } finally {
            isRefreshing = false;
        }
    }

    function updateBannedInfo() {
        const info = document.getElementById("bannedStatsInfo");
        let parts = [];
        
        // Banned stats
        for (const variant of BANNED_VARIANTS) {
            const count = bannedData[variant.key] ? bannedData[variant.key].length : 0;
            const label = variant.label;
            const status = count > 0 ? `✅ ${count}` : '❌ 0';
            parts.push(`${label}: ${status}`);
        }
        
        // Random stats
        for (const random of RANDOM_STATS) {
            const count = randomData[random.key] ? randomData[random.key].length : 0;
            const label = random.label;
            const status = count > 0 ? `✅ ${count}` : '❌ 0';
            parts.push(`${label}: ${status}`);
        }
        
        info.textContent = `📊 ${parts.join(' | ')}`;
        
        // Update button styles
        for (const variant of BANNED_VARIANTS) {
            const btn = document.querySelector(`[data-character="${variant.key}"]`);
            const count = bannedData[variant.key] ? bannedData[variant.key].length : 0;
            if (btn) {
                btn.classList.remove('has-data', 'no-data');
                if (count > 0) {
                    btn.classList.add('has-data');
                } else {
                    btn.classList.add('no-data');
                }
            }
        }
        for (const random of RANDOM_STATS) {
            const btn = document.querySelector(`[data-character="${random.key}"]`);
            const count = randomData[random.key] ? randomData[random.key].length : 0;
            if (btn) {
                btn.classList.remove('has-data', 'no-data');
                if (count > 0) {
                    btn.classList.add('has-data');
                } else {
                    btn.classList.add('no-data');
                }
            }
        }
    }

    async function refreshLeaderboard() {
        const btn = document.getElementById("refreshBtn");
        btn.disabled = true;
        btn.textContent = "⏳ Loading...";

        await fetchLeaderboard();

        btn.disabled = false;
        btn.textContent = "🔄 Refresh";

    // ─── FILTERS ─────────────────────────────────────────────────────────────
    function setCharacter(character) {
        currentCharacter = character;
        document.querySelectorAll('[data-character]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.character === character);
        });
        filterTable();
    }

    function updateFiltersUI() {
        document.querySelectorAll('[data-character]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.character === currentCharacter);
        });
    }

    // ─── TABLE RENDER ──────────────────────────────────────────────────────
    function filterTable() {
        const charFilter = currentCharacter;

        if (charFilter === "all") {
            filteredEntries = [...allEntries];
        } else if (charFilter === "BANNED_ALL") {
            // Show all banned players (any source)
            filteredEntries = allEntries.filter(e => e.isBanned === true);
        } else if (charFilter.startsWith("BANNED_V")) {
            // Show specific banned variant
            filteredEntries = allEntries.filter(e => e.source === charFilter);
        } else if (charFilter === "RandomExplorer" || charFilter === "RandomNeighbor") {
            // Show specific random stat
            filteredEntries = allEntries.filter(e => e.source === charFilter);
        } else {
            // Normal character filter
            filteredEntries = allEntries.filter(e => e.character === charFilter);
        }
        currentPage = 1;
        renderTable();
    }

    function renderTable() {
        const container = document.getElementById('tableContainer');
        const paginationContainer = document.getElementById('paginationContainer');

        if (!filteredEntries || filteredEntries.length === 0) {
            let message = '🔍 No players found matching your filters';
            let icon = '🔍';
            if (currentCharacter === "RandomExplorer" || currentCharacter === "RandomNeighbor") {
                message = '🎲 This stat has no data. It might not exist in the game.';
                icon = '🎲';
            } else if (currentCharacter.startsWith("BANNED_V")) {
                message = '🔨 This banned stat has no data. Try another variant.';
                icon = '🔨';
            } else if (currentCharacter === "BANNED_ALL") {
                message = '🔨 No banned players found.';
                icon = '✅';
            }
            container.innerHTML = `
                <div class="empty-state">
                    <span class="big-icon">${icon}</span>
                    ${message}
                </div>
            `;
            paginationContainer.style.display = 'none';
            return;
        }

        const totalPages = Math.ceil(filteredEntries.length / pageSize);
        const start = (currentPage - 1) * pageSize;
        const end = Math.min(start + pageSize, filteredEntries.length
