<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Secret Neighbor Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #16213e;
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            color: #e94560;
            font-size: 28px;
        }
        .header .stats {
            color: #aaa;
            font-size: 14px;
        }
        .header .stats span { color: #e94560; font-weight: bold; }

        .cache-info {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #2a2a4a;
            font-size: 13px;
            color: #888;
        }
        .cache-info .updated { color: #2ecc71; }
        .cache-info .token-status { color: #e94560; }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #16213e;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .filter-group-label {
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            margin-right: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .filter-btn {
            padding: 5px 12px;
            border-radius: 16px;
            border: 2px solid transparent;
            background: #0f3460;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .filter-btn:hover { border-color: #e94560; color: white; }
        .filter-btn.active {
            background: #e94560;
            color: white;
            border-color: #e94560;
        }
        .filter-divider {
            width: 1px;
            height: 30px;
            background: #2a2a4a;
            margin: 0 8px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover { background: #1a4a8a; }
        .search-box {
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #16213e;
            color: white;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
        }
        .search-box:focus { border-color: #e94560; outline: none; }

        .table-wrap {
            background: #16213e;
            border-radius: 16px;
            border: 2px solid #2a2a4a;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #0f3460;
            color: #e94560;
            padding: 14px 18px;
            text-align: left;
            font-weight: bold;
            font-size: 14px;
        }
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #1a1a3e;
            color: #ddd;
            font-size: 14px;
        }
        tr:hover td { background: #1a2a4a; }

        .rank-1 td { color: #ffd700; font-weight: bold; }
        .rank-2 td { color: #c0c0c0; font-weight: bold; }
        .rank-3 td { color: #cd7f32; font-weight: bold; }

        .rank-number { font-weight: bold; color: #e94560; }
        .rank-1 .rank-number { color: #ffd700; }
        .rank-2 .rank-number { color: #c0c0c0; }
        .rank-3 .rank-number { color: #cd7f32; }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-cell img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 6px;
            background: #0f3460;
            padding: 2px;
        }
        .player-name { font-weight: 500; }
        .you-badge {
            background: #e94560;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: bold;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #555;
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
        .footer a {
            color: #e94560;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 6px 14px;
            background: #0f3460;
            color: #aaa;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .page-btn:hover { border-color: #e94560; color: white; }
        .page-btn.active { background: #e94560; color: white; border-color: #e94560; }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #555;
        }

        .token-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .token-input-row input {
            padding: 8px 14px;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #0f3460;
            color: white;
            font-size: 13px;
            flex: 1;
            min-width: 200px;
        }
        .token-input-row input:focus { border-color: #e94560; outline: none; }
        .token-status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .token-status-dot.valid { background: #2ecc71; }
        .token-status-dot.invalid { background: #e94560; }

        .platform-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            background: #0f3460;
            color: #aaa;
        }
        .platform-badge.steam { background: #1a1a2e; color: #66c0f4; }
        .platform-badge.xbox { background: #107c10; color: #fff; }
        .platform-badge.playstation { background: #003791; color: #fff; }
        .platform-badge.switch { background: #e60012; color: #fff; }
        .platform-badge.ios { background: #555; color: #fff; }

        @media (max-width: 600px) {
            .header { flex-direction: column; text-align: center; }
            .filters { flex-direction: column; }
            .filter-group { flex-wrap: wrap; }
            .controls { flex-direction: column; }
            .search-box { max-width: 100%; width: 100%; }
            .token-input-row input { width: 100%; }
            th, td { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>🏆 Leaderboard</h1>
        <div class="stats">
            👥 <span id="totalPlayers">0</span> players &nbsp;|&nbsp;
            📈 Top Level: <span id="topLevel">0</span>
        </div>
    </div>

    <div class="cache-info">
        <div>
            📦 Cache: <span class="updated" id="cacheStatus">Not loaded yet</span>
        </div>
        <div class="token-status" id="tokenStatus">
            <span class="token-status-dot invalid" id="tokenDot"></span>
            <span id="tokenText">No token set</span>
        </div>
    </div>

    <div class="controls">
        <div class="token-input-row">
            <input type="password" id="tokenInput" placeholder="Enter X-Authorization token..." />
            <button class="btn" id="tokenBtn" onclick="setToken()">🔑 Set Token</button>
            <button class="btn btn-secondary" onclick="clearToken()">✕ Clear</button>
        </div>
    </div>

    <div class="filters">
        <div class="filter-group">
            <span class="filter-group-label">🎮 Platform</span>
            <button class="filter-btn active" data-platform="all" onclick="setPlatform('all')">🌐 All</button>
            <button class="filter-btn" data-platform="STEAM" onclick="setPlatform('STEAM')">💨 Steam</button>
            <button class="filter-btn" data-platform="XBOX" onclick="setPlatform('XBOX')">🎮 Xbox</button>
            <button class="filter-btn" data-platform="MICROSOFT" onclick="setPlatform('MICROSOFT')">🖥️ MS Store</button>
            <button class="filter-btn" data-platform="PLAYSTATION" onclick="setPlatform('PLAYSTATION')">🎮 PS</button>
            <button class="filter-btn" data-platform="SWITCH" onclick="setPlatform('SWITCH')">🕹️ Switch</button>
            <button class="filter-btn" data-platform="IOS" onclick="setPlatform('IOS')">📱 iOS</button>
        </div>

        <div class="filter-divider"></div>

        <div class="filter-group" id="characterFilters">
            <span class="filter-group-label">👤 Character</span>
            <button class="filter-btn active" data-character="all" onclick="setCharacter('all')">👥 All</button>
            <button class="filter-btn" data-character="Bagger" onclick="setCharacter('Bagger')">🎒 Bagger</button>
            <button class="filter-btn" data-character="Brave" onclick="setCharacter('Brave')">🛡️ Brave</button>
            <button class="filter-btn" data-character="Detective" onclick="setCharacter('Detective')">🔍 Detective</button>
            <button class="filter-btn" data-character="Engineer" onclick="setCharacter('Engineer')">🔧 Engineer</button>
            <button class="filter-btn" data-character="Leader" onclick="setCharacter('Leader')">⭐ Leader</button>
            <button class="filter-btn" data-character="Journalist" onclick="setCharacter('Journalist')">📰 Journalist</button>
            <button class="filter-btn" data-character="Scout" onclick="setCharacter('Scout')">🔭 Scout</button>
            <button class="filter-btn" data-character="Guest" onclick="setCharacter('Guest')">🚪 Guest</button>
            <button class="filter-btn" data-character="Neighbor" onclick="setCharacter('Neighbor')">🏠 Neighbor</button>
            <button class="filter-btn" data-character="Butcher" onclick="setCharacter('Butcher')">🔪 Butcher</button>
            <button class="filter-btn" data-character="Clown" onclick="setCharacter('Clown')">🤡 Clown</button>
            <button class="filter-btn" data-character="Ghost" onclick="setCharacter('Ghost')">👻 Ghost</button>
            <button class="filter-btn" data-character="Taxidermist" onclick="setCharacter('Taxidermist')">🧸 Taxidermist</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="refreshLeaderboard()" id="refreshBtn">🔄 Refresh</button>
        <button class="btn btn-secondary" onclick="resetSearch()">✕ Clear Search</button>
        <input class="search-box" id="searchBox" placeholder="🔍 Search player..." oninput="filterTable()"/>
    </div>

    <div class="table-wrap">
        <div id="tableContainer">
            <div class="loading">📦 Loading leaderboard from cache...</div>
        </div>
        <div id="paginationContainer" style="display:none;"></div>
    </div>

    <div class="footer">
        <a href="https://a4yoshi.github.io">← Back to a4Yoshi Tools</a> &bull; Data from PlayFab
    </div>
</div>

<script>
    // ─── CONFIG ──────────────────────────────────────────────────────────────
    const CACHE_KEY = "leaderboard_cache";
    const TOKEN_KEY = "leaderboard_token";

    // Platform-specific servers
    const PLATFORM_SERVERS = {
        "STEAM": "https://bdff1.playfabapi.com",
        "XBOX": "https://bdff1.playfabapi.com",
        "MICROSOFT": "https://bdff1.playfabapi.com",
        "PLAYSTATION": "https://c6252.playfabapi.com",
        "SWITCH": "https://c6252.playfabapi.com",
        "IOS": "https://c6252.playfabapi.com"
    };

    const STAT_NAME = "LeaderBoard_AccountLevel";

    // ─── CHARACTER MAPPING ──────────────────────────────────────────────────
    const CHARACTER_MAP = {
        "Bagger": { icon: "bagger.png", label: "Bagger", class: "Survivor" },
        "Brave": { icon: "brave.png", label: "Brave", class: "Survivor" },
        "Detective": { icon: "detective.png", label: "Detective", class: "Survivor" },
        "Engineer": { icon: "engineer.png", label: "Engineer", class: "Survivor" },
        "Leader": { icon: "leader.png", label: "Leader", class: "Survivor" },
        "Journalist": { icon: "journalist.png", label: "Journalist", class: "Survivor" },
        "Scout": { icon: "scout.png", label: "Scout", class: "Survivor" },
        "Guest": { icon: "guest.png", label: "Guest", class: "Survivor" },
        "Neighbor": { icon: "neighbor.png", label: "Neighbor", class: "Neighbor" },
        "Butcher": { icon: "butcher.png", label: "Butcher", class: "Neighbor" },
        "Clown": { icon: "clown.png", label: "Clown", class: "Neighbor" },
        "Ghost": { icon: "ghost.png", label: "Ghost", class: "Neighbor" },
        "Taxidermist": { icon: "taxidermist.png", label: "Taxidermist", class: "Neighbor" },
        "Random Survivor": { icon: "random_survivor.png", label: "Random Survivor", class: "Survivor" },
        "Random Neighbor": { icon: "random_neighbor.png", label: "Random Neighbor", class: "Neighbor" },
    };

    // ─── STATE ──────────────────────────────────────────────────────────────
    let allEntries = [];
    let filteredEntries = [];
    let currentPage = 1;
    const pageSize = 50; // Game shows top 50
    let currentPlatform = "all";
    let currentCharacter = "all";
    let userToken = localStorage.getItem(TOKEN_KEY) || "";

    // ─── TOKEN HANDLING ─────────────────────────────────────────────────────
    function setToken() {
        const input = document.getElementById("tokenInput");
        const token = input.value.trim();
        if (!token) {
            alert("Please enter a token!");
            return;
        }
        userToken = token;
        localStorage.setItem(TOKEN_KEY, token);
        updateTokenStatus();
        refreshLeaderboard();
        input.value = "";
    }

    function clearToken() {
        userToken = "";
        localStorage.removeItem(TOKEN_KEY);
        updateTokenStatus();
        loadFromCache();
    }

    function updateTokenStatus() {
        const dot = document.getElementById("tokenDot");
        const text = document.getElementById("tokenText");
        if (userToken) {
            dot.className = "token-status-dot valid";
            text.textContent = "Token set ✓";
            text.style.color = "#2ecc71";
        } else {
            dot.className = "token-status-dot invalid";
            text.textContent = "No token set — using cache";
            text.style.color = "#e94560";
        }
    }

    // ─── CACHE HANDLING (PERMANENT) ──────────────────────────────────────────
    function saveToCache(data, platform, character) {
        const cache = {
            data: data,
            platform: platform,
            character: character,
            timestamp: Date.now()
        };
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
        } catch (e) {}
        updateCacheStatus();
    }

    function loadFromCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) {
                document.getElementById("tableContainer").innerHTML = `
                    <div class="empty-state">📦 No cached data available. Please set a token and refresh.</div>
                `;
                return false;
            }
            const cache = JSON.parse(raw);
            allEntries = cache.data;
            filteredEntries = [...allEntries];
            currentPlatform = cache.platform || "all";
            currentCharacter = cache.character || "all";
            updateStats();
            renderTable();
            updateCacheStatus();
            updateFiltersUI();
            return true;
        } catch (e) {
            return false;
        }
    }

    function updateCacheStatus() {
        const status = document.getElementById("cacheStatus");
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) {
                status.textContent = "No cache";
                status.style.color = "#e94560";
                return;
            }
            const cache = JSON.parse(raw);
            const date = new Date(cache.timestamp);
            const age = Math.floor((Date.now() - cache.timestamp) / 60000);
            status.textContent = `${date.toLocaleString()} (${age}m ago) — 💾 Permanent cache`;
            status.style.color = age < 60 ? "#2ecc71" : age < 1440 ? "#f39c12" : "#e94560";
        } catch (e) {
            status.textContent = "Cache error";
            status.style.color = "#e94560";
        }
    }

    // ─── FETCH LEADERBOARD ──────────────────────────────────────────────────
    async function fetchLeaderboard(platform = null) {
        if (!userToken) {
            alert("⚠️ Please set your X-Authorization token first!");
            return null;
        }

        const container = document.getElementById("tableContainer");
        container.innerHTML = '<div class="loading">⏳ Fetching leaderboard...</div>';

        try {
            // Determine which server to use
            const server = platform && platform !== "all" && PLATFORM_SERVERS[platform]
                ? PLATFORM_SERVERS[platform]
                : "https://bdff1.playfabapi.com";

            const statName = platform && platform !== "all"
                ? `${STAT_NAME}_${platform}`
                : STAT_NAME;

            const url = `${server}/Client/GetLeaderboard?sdk=UnitySDK-2.155.221207`;

            const body = {
                MaxResultsCount: 50, // Game shows top 50
                StartPosition: 0,
                StatisticName: statName
            };

            const res = await fetch(url, {
                method: "POST",
                headers: {
                    "X-Authorization": userToken,
                    "Content-Type": "application/json",
                    "X-PlayFabSDK": "UnitySDK-2.155.221207",
                    "X-ReportErrorAsSuccess": "true",
                    "Accept": "*/*"
                },
                body: JSON.stringify(body)
            });

            const data = await res.json();

            if (data.code === 200 && data.data && data.data.Leaderboard) {
                // Parse character from display name
                const entries = data.data.Leaderboard.map((entry, idx) => {
                    const displayName = entry.DisplayName || entry.PlayFabId || "";
                    let character = "Unknown";
                    let characterKey = "Unknown";
                    
                    // Try to extract character from display name
                    for (const [key, info] of Object.entries(CHARACTER_MAP)) {
                        if (displayName.includes(key) || displayName.includes(info.label)) {
                            character = info.label;
                            characterKey = key;
                            break;
                        }
                    }

                    return {
                        ...entry,
                        character: character,
                        characterKey: characterKey,
                        displayName: displayName,
                        rank: entry.Position !== undefined ? entry.Position + 1 : idx + 1,
                        platform: platform || "STEAM"
                    };
                });

                saveToCache(entries, platform || "all", currentCharacter);
                allEntries = entries;
                filteredEntries = [...entries];
                updateStats();
                renderTable();
                updateCacheStatus();
                return entries;
            } else {
                container.innerHTML = `
                    <div class="empty-state" style="color:#e94560;">
                        ⚠️ Error: ${data.errorMessage || "Unknown error"}<br>
                        <span style="font-size:12px;color:#555;">Try refreshing with a valid token</span>
                    </div>
                `;
                return null;
            }
        } catch (e) {
            container.innerHTML = `
                <div class="empty-state" style="color:#e94560;">
                    ⚠️ Network error: ${e.message}<br>
                    <span style="font-size:12px;color:#555;">Check your connection and try again</span>
                </div>
            `;
            return null;
        }
    }

    async function refreshLeaderboard() {
        const btn = document.getElementById("refreshBtn");
        btn.disabled = true;
        btn.textContent = "⏳ Loading...";

        const platform = currentPlatform === "all" ? null : currentPlatform;
        await fetchLeaderboard(platform);

        btn.disabled = false;
        btn.textContent = "🔄 Refresh";
    }

    // ─── FILTERS ─────────────────────────────────────────────────────────────
    function setPlatform(platform) {
        currentPlatform = platform;
        document.querySelectorAll('[data-platform]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.platform === platform);
        });
        refreshLeaderboard();
    }

    function setCharacter(character) {
        currentCharacter = character;
        document.querySelectorAll('[data-character]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.character === character);
        });
        filterTable();
    }

    function updateFiltersUI() {
        document.querySelectorAll('[data-platform]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.platform === currentPlatform);
        });
        document.querySelectorAll('[data-character]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.character === currentCharacter);
        });
    }

    // ─── TABLE RENDER ──────────────────────────────────────────────────────
    function filterTable() {
        const query = document.getElementById('searchBox').value.toLowerCase().trim();
        const charFilter = currentCharacter;

        if (!query && charFilter === "all") {
            filteredEntries = [...allEntries];
        } else {
            filteredEntries = allEntries.filter(e => {
                let match = true;
                if (query) {
                    const name = (e.displayName || '').toLowerCase();
                    match = match && name.includes(query);
                }
                if (charFilter !== "all") {
                    match = match && e.characterKey === charFilter;
                }
                return match;
            });
        }
        currentPage = 1;
        renderTable();
    }

    function resetSearch() {
        document.getElementById('searchBox').value = '';
        filterTable();
    }

    function renderTable() {
        const container = document.getElementById('tableContainer');
        const paginationContainer = document.getElementById('paginationContainer');

        if (!filteredEntries || filteredEntries.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    ${allEntries.length === 0 ? '📦 No data loaded. Set a token and refresh.' : '🔍 No players found matching your filters'}
                </div>
            `;
            paginationContainer.style.display = 'none';
            return;
        }

        const totalPages = Math.ceil(filteredEntries.length / pageSize);
        const start = (currentPage - 1) * pageSize;
        const end = Math.min(start + pageSize, filteredEntries.length);
        const pageEntries = filteredEntries.slice(start, end);

        let html = `<table>
            <thead><tr>
                <th>#</th>
                <th>Player</th>
                <th>Character</th>
                <th>Level</th>
                <th>Platform</th>
            </tr></thead><tbody>`;

        pageEntries.forEach((entry, idx) => {
            const rank = start + idx + 1;
            const rankClass = rank <= 3 ? `rank-${rank}` : '';
            const level = entry.StatValue || 0;
            const charInfo = CHARACTER_MAP[entry.characterKey] || { icon: 'default.png', label: entry.character || 'Unknown' };
            
            // Platform badge class
            const platformClass = (entry.platform || 'STEAM').toLowerCase();

            html += `
                <tr class="${rankClass}">
                    <td class="rank-number">#${rank}</td>
                    <td>
                        <div class="player-cell">
                            <img src="images/characters/${charInfo.icon}" onerror="this.style.display='none'"/>
                            <span class="player-name">${entry.displayName || 'Anonymous'}</span>
                        </div>
                    </td>
                    <td>${charInfo.label}</td>
                    <td>${level}</td>
                    <td><span class="platform-badge ${platformClass}">${entry.platform || 'STEAM'}</span></td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

        if (totalPages > 1) {
            paginationContainer.style.display = 'flex';
            let pHtml = '';
            for (let i = 1; i <= totalPages; i++) {
                pHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            paginationContainer.innerHTML = pHtml;
        } else {
            paginationContainer.style.display = 'none';
        }
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
    }

    function updateStats() {
        document.getElementById('totalPlayers').textContent = allEntries.length;
        const maxLevel = allEntries.reduce((max, e) => Math.max(max, e.StatValue || 0), 0);
        document.getElementById('topLevel').textContent = maxLevel;
    }

    // ─── INIT ──────────────────────────────────────────────────────────────
    function init() {
        updateTokenStatus();

        const hasCache = loadFromCache();

        if (userToken && !hasCache) {
            refreshLeaderboard();
        }

        // Auto-refresh every 5 minutes if token exists
        setInterval(() => {
            if (userToken) {
                refreshLeaderboard();
            }
        }, 300000);
    }

    init();
</script>
</body>
</html>
