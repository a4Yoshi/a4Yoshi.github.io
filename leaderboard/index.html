<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Secret Neighbor Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #16213e;
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            color: #e94560;
            font-size: 28px;
        }
        .header .stats {
            color: #aaa;
            font-size: 14px;
        }
        .header .stats span { color: #e94560; font-weight: bold; }

        .cache-info {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #2a2a4a;
            font-size: 13px;
            color: #888;
        }
        .cache-info .updated { color: #2ecc71; }
        .cache-info .token-status { color: #e94560; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover { background: #1a4a8a; }

        .table-wrap {
            background: #16213e;
            border-radius: 16px;
            border: 2px solid #2a2a4a;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #0f3460;
            color: #e94560;
            padding: 14px 18px;
            text-align: left;
            font-weight: bold;
            font-size: 14px;
        }
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #1a1a3e;
            color: #ddd;
            font-size: 14px;
        }
        tr:hover td { background: #1a2a4a; }

        .rank-1 td { color: #ffd700; font-weight: bold; }
        .rank-2 td { color: #c0c0c0; font-weight: bold; }
        .rank-3 td { color: #cd7f32; font-weight: bold; }

        .rank-number { font-weight: bold; color: #e94560; }
        .rank-1 .rank-number { color: #ffd700; }
        .rank-2 .rank-number { color: #c0c0c0; }
        .rank-3 .rank-number { color: #cd7f32; }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-cell img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 6px;
            background: #0f3460;
            padding: 2px;
        }
        .player-name { font-weight: 500; }
        .you-badge {
            background: #e94560;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: bold;
        }
        .banned-badge {
            background: #111;
            color: #e94560;
            border: 1px solid #e94560;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: bold;
        }
        .banned-row td { opacity: 0.6; }

        .loading {
            padding: 40px;
            text-align: center;
            color: #555;
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
        .footer a {
            color: #e94560;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 6px 14px;
            background: #0f3460;
            color: #aaa;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .page-btn:hover { border-color: #e94560; color: white; }
        .page-btn.active { background: #e94560; color: white; border-color: #e94560; }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #555;
        }

        .token-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .token-input-row input {
            padding: 8px 14px;
            border-radius: 8px;
            border: 2px solid #2a2a4a;
            background: #0f3460;
            color: white;
            font-size: 13px;
            flex: 1;
            min-width: 200px;
        }
        .token-input-row input:focus { border-color: #e94560; outline: none; }
        .token-status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .token-status-dot.valid { background: #2ecc71; }
        .token-status-dot.invalid { background: #e94560; }

        .platform-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            background: #1a1a2e;
            color: #66c0f4;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #16213e;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .filter-group-label {
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            margin-right: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .filter-btn {
            padding: 5px 12px;
            border-radius: 16px;
            border: 2px solid transparent;
            background: #0f3460;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .filter-btn:hover { border-color: #e94560; color: white; }
        .filter-btn.active {
            background: #e94560;
            color: white;
            border-color: #e94560;
        }
        .filter-divider {
            width: 1px;
            height: 30px;
            background: #2a2a4a;
            margin: 0 8px;
        }

        @media (max-width: 600px) {
            .header { flex-direction: column; text-align: center; }
            .filters { flex-direction: column; }
            .filter-group { flex-wrap: wrap; }
            .controls { flex-direction: column; }
            .token-input-row input { width: 100%; }
            th, td { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>🏆 Steam Leaderboard</h1>
        <div class="stats">
            👥 <span id="totalPlayers">0</span> players &nbsp;|&nbsp;
            📈 Top Level: <span id="topLevel">0</span>
        </div>
    </div>

    <div class="cache-info">
        <div>
            📦 Cache: <span class="updated" id="cacheStatus">Not loaded yet</span>
        </div>
        <div class="token-status" id="tokenStatus">
            <span class="token-status-dot invalid" id="tokenDot"></span>
            <span id="tokenText">No token set</span>
        </div>
    </div>

    <div class="controls">
        <div class="token-input-row">
            <input type="password" id="tokenInput" placeholder="Enter X-Authorization token..." />
            <button class="btn" id="tokenBtn" onclick="setToken()">🔑 Set Token</button>
            <button class="btn btn-secondary" onclick="clearToken()">✕ Clear</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="refreshLeaderboard()" id="refreshBtn">🔄 Refresh</button>
    </div>

    <div class="filters">
        <div class="filter-group">
            <span class="filter-group-label">👤 Character</span>
            <button class="filter-btn active" data-character="all" onclick="setCharacter('all')">👥 All</button>
            <button class="filter-btn" data-character="Bagger" onclick="setCharacter('Bagger')">🎒 Bagger</button>
            <button class="filter-btn" data-character="Brave" onclick="setCharacter('Brave')">🛡️ Brave</button>
            <button class="filter-btn" data-character="Detective" onclick="setCharacter('Detective')">🔍 Detective</button>
            <button class="filter-btn" data-character="Inventor" onclick="setCharacter('Inventor')">🔧 Inventor</button>
            <button class="filter-btn" data-character="Leader" onclick="setCharacter('Leader')">⭐ Leader</button>
            <button class="filter-btn" data-character="Quentin" onclick="setCharacter('Quentin')">📰 Quentin</button>
            <button class="filter-btn" data-character="Scout" onclick="setCharacter('Scout')">🔭 Scout</button>
            <button class="filter-btn" data-character="RandomExplorer" onclick="setCharacter('RandomExplorer')">🎲 Random Explorer</button>
            <button class="filter-btn" data-character="RandomNeighbor" onclick="setCharacter('RandomNeighbor')">🎲 Random Neighbor</button>
            <button class="filter-btn" data-character="Neighbor" onclick="setCharacter('Neighbor')">🏠 Neighbor</button>
            <button class="filter-btn" data-character="Butcher" onclick="setCharacter('Butcher')">🔪 Butcher</button>
            <button class="filter-btn" data-character="Clown" onclick="setCharacter('Clown')">🤡 Clown</button>
            <button class="filter-btn" data-character="Ghost" onclick="setCharacter('Ghost')">👻 Ghost</button>
            <button class="filter-btn" data-character="Guest" onclick="setCharacter('Guest')">🚪 Guest</button>
            <button class="filter-btn" data-character="Hunter" onclick="setCharacter('Hunter')">🧸 Hunter</button>
            <button class="filter-btn" data-character="BANNED" onclick="setCharacter('BANNED')">🔨 Banned</button>
        </div>
    </div>

    <div class="table-wrap">
        <div id="tableContainer">
            <div class="loading">📦 Loading leaderboard from cache...</div>
        </div>
        <div id="paginationContainer" style="display:none;"></div>
    </div>

    <div class="footer">
        <a href="https://a4yoshi.github.io">← Back to a4Yoshi Tools</a> &bull; Data from PlayFab
    </div>
</div>

<script>
    // ─── CONFIG ──────────────────────────────────────────────────────────────
    const CACHE_KEY = "leaderboard_cache";
    const TOKEN_KEY = "leaderboard_token";
    const PROXY = "https://sweet-credit-ba20.berenddominik026.workers.dev";
    const PLATFORM = "STEAM";
    const STAT_NAME = "LeaderBoard_AccountLevelSTEAM";

    // ─── CHARACTER MAPPING ──────────────────────────────────────────────────
    const CHARACTER_LIST = [
        "Bagger",
        "Brave",
        "Detective",
        "Inventor",
        "Leader",
        "Quentin",
        "Scout",
        "RandomExplorer",
        "RandomNeighbor",
        "Neighbor",
        "Butcher",
        "Clown",
        "Ghost",
        "Guest",
        "Hunter"
    ];

    const CHARACTER_DISPLAY = {
        "Bagger": "Bagger",
        "Brave": "Brave",
        "Detective": "Detective",
        "Inventor": "Inventor",
        "Leader": "Leader",
        "Quentin": "Quentin",
        "Scout": "Scout",
        "RandomExplorer": "Random Explorer",
        "RandomNeighbor": "Random Neighbor",
        "Neighbor": "Neighbor",
        "Butcher": "Butcher",
        "Clown": "Clown",
        "Ghost": "Ghost",
        "Guest": "Guest",
        "Hunter": "Hunter"
    };

    const CHARACTER_ICONS = {
        "Bagger": "bagger.png",
        "Brave": "brave.png",
        "Detective": "detective.png",
        "Inventor": "inventor.png",
        "Leader": "leader.png",
        "Quentin": "quentin.png",
        "Scout": "scout.png",
        "RandomExplorer": "random_explorer.png",
        "RandomNeighbor": "random_neighbor.png",
        "Neighbor": "neighbor.png",
        "Butcher": "butcher.png",
        "Clown": "clown.png",
        "Ghost": "ghost.png",
        "Guest": "guest.png",
        "Hunter": "hunter.png"
    };

    // Banned variations to check
    const BANNED_VARIANTS = [
        "LeaderBoard_BannedSTEAM",
        "LeaderBoard_BANNEDSTEAM",
        "LeaderBoard_Banned"
    ];

    // ─── STATE ──────────────────────────────────────────────────────────────
    let allEntries = [];
    let filteredEntries = [];
    let currentPage = 1;
    const pageSize = 50;
    let currentCharacter = "all";
    let userToken = localStorage.getItem(TOKEN_KEY) || "";
    let isRefreshing = false;

    // ─── TOKEN HANDLING ─────────────────────────────────────────────────────
    function setToken() {
        const input = document.getElementById("tokenInput");
        const token = input.value.trim();
        if (!token) {
            alert("Please enter a token!");
            return;
        }
        userToken = token;
        localStorage.setItem(TOKEN_KEY, token);
        updateTokenStatus();
        refreshLeaderboard();
        input.value = "";
    }

    function clearToken() {
        userToken = "";
        localStorage.removeItem(TOKEN_KEY);
        updateTokenStatus();
        loadFromCache();
    }

    function updateTokenStatus() {
        const dot = document.getElementById("tokenDot");
        const text = document.getElementById("tokenText");
        if (userToken) {
            dot.className = "token-status-dot valid";
            text.textContent = "Token set ✓";
            text.style.color = "#2ecc71";
        } else {
            dot.className = "token-status-dot invalid";
            text.textContent = "No token set — using cache";
            text.style.color = "#e94560";
        }
    }

    // ─── CACHE HANDLING ──────────────────────────────────────────────────────
    function saveToCache(data, character) {
        const cache = {
            data: data,
            character: character,
            timestamp: Date.now()
        };
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
        } catch (e) {}
        updateCacheStatus();
    }

    function loadFromCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) {
                document.getElementById("tableContainer").innerHTML = `
                    <div class="empty-state">📦 No cached data available. Please set a token and refresh.</div>
                `;
                return false;
            }
            const cache = JSON.parse(raw);
            allEntries = cache.data;
            filteredEntries = [...allEntries];
            currentCharacter = cache.character || "all";
            updateStats();
            renderTable();
            updateCacheStatus();
            updateFiltersUI();
            return true;
        } catch (e) {
            return false;
        }
    }

    function updateCacheStatus() {
        const status = document.getElementById("cacheStatus");
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) {
                status.textContent = "No cache";
                status.style.color = "#e94560";
                return;
            }
            const cache = JSON.parse(raw);
            const date = new Date(cache.timestamp);
            const age = Math.floor((Date.now() - cache.timestamp) / 60000);
            status.textContent = `${date.toLocaleString()} (${age}m ago) — 💾 Permanent cache`;
            status.style.color = age < 60 ? "#2ecc71" : age < 1440 ? "#f39c12" : "#e94560";
        } catch (e) {
            status.textContent = "Cache error";
            status.style.color = "#e94560";
        }
    }

    // ─── FETCH LEADERBOARD ──────────────────────────────────────────────────
    async function fetchLeaderboard() {
        if (!userToken) {
            alert("⚠️ Please set your X-Authorization token first!");
            return null;
        }

        if (isRefreshing) return null;
        isRefreshing = true;

        const container = document.getElementById("tableContainer");
        container.innerHTML = '<div class="loading">⏳ Fetching leaderboard...</div>';

        try {
            const server = `${PROXY}/${PLATFORM}`;
            const allResults = [];
            let totalFetched = 0;

            // ─── STEP 1: Refresh Cloud Script ──────────────────────────────
            const currentLevelProgression = {
                playerLevel: "56",
                classLevel: [
                    { classId: "Bagman", XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 0 },
                    { classId: "Brave", XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 1 },
                    { classId: "Steam", XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 1 },
                    { classId: "Team", XP: 0, XpToNextLevel: 300, level: 0, availablePerkSlotsCount: 2 }
                ]
            };

            const cloudScriptBody = {
                FunctionName: "refreshLeaderboardPlatform",
                FunctionParameter: {
                    currentLevelProgression: currentLevelProgression,
                    platformName: PLATFORM
                },
                GeneratePlayStreamEvent: true,
                RevisionSelection: null,
                SpecificRevision: null
            };

            console.log("📡 Executing Cloud Script...");
            await fetch(`${server}/Client/ExecuteCloudScript?sdk=UnitySDK-2.155.221207`, {
                method: "POST",
                headers: {
                    "X-Authorization": userToken,
                    "Content-Type": "application/json",
                    "X-PlayFabSDK": "UnitySDK-2.155.221207",
                    "X-ReportErrorAsSuccess": "true",
                    "Accept": "*/*",
                    "X-Unity-Version": "2022.3.14f1"
                },
                body: JSON.stringify(cloudScriptBody)
            });

            // ─── STEP 2: Fetch Main Leaderboard ────────────────────────────
            console.log(`📡 Fetching main leaderboard: ${STAT_NAME}`);
            const lbBody = {
                MaxResultsCount: 100,
                StartPosition: 0,
                StatisticName: STAT_NAME
            };

            const response = await fetch(`${server}/Client/GetLeaderboard?sdk=UnitySDK-2.155.221207`, {
                method: "POST",
                headers: {
                    "X-Authorization": userToken,
                    "Content-Type": "application/json",
                    "X-PlayFabSDK": "UnitySDK-2.155.221207",
                    "X-ReportErrorAsSuccess": "true",
                    "Accept": "*/*",
                    "X-Unity-Version": "2022.3.14f1"
                },
                body: JSON.stringify(lbBody)
            });

            const data = await response.json();
            console.log("✅ Leaderboard Response:", data);

            if (data.code === 200 && data.data && data.data.Leaderboard) {
                data.data.Leaderboard.forEach(entry => {
                    const displayName = entry.DisplayName || entry.PlayFabId || "Anonymous";
                    const isBanned = !entry.DisplayName || entry.DisplayName.trim() === "";

                    // Detect character from display name
                    let character = "Unknown";
                    for (const charKey of CHARACTER_LIST) {
                        const display = CHARACTER_DISPLAY[charKey];
                        if (displayName.includes(charKey) || displayName.includes(display)) {
                            character = charKey;
                            break;
                        }
                    }

                    // Check if banned
                    if (isBanned) {
                        character = "BANNED";
                    }

                    allResults.push({
                        ...entry,
                        character: character,
                        characterDisplay: character === "BANNED" ? "BANNED" : (CHARACTER_DISPLAY[character] || character),
                        displayName: isBanned ? (entry.PlayFabId || "Banned Player") : displayName,
                        platform: PLATFORM,
                        StatValue: entry.StatValue || 0,
                        isBanned: isBanned
                    });
                });
                totalFetched = allResults.length;
            }

            console.log(`✅ Total players fetched: ${allResults.length}`);

            // ─── STEP 3: Fetch Banned Variants ─────────────────────────────
            for (const bannedStat of BANNED_VARIANTS) {
                console.log(`📡 Fetching banned variant: ${bannedStat}`);
                try {
                    const bannedBody = {
                        MaxResultsCount: 100,
                        StartPosition: 0,
                        StatisticName: bannedStat
                    };

                    const bannedResponse = await fetch(`${server}/Client/GetLeaderboard?sdk=UnitySDK-2.155.221207`, {
                        method: "POST",
                        headers: {
                            "X-Authorization": userToken,
                            "Content-Type": "application/json",
                            "X-PlayFabSDK": "UnitySDK-2.155.221207",
                            "X-ReportErrorAsSuccess": "true",
                            "Accept": "*/*",
                            "X-Unity-Version": "2022.3.14f1"
                        },
                        body: JSON.stringify(bannedBody)
                    });

                    const bannedData = await bannedResponse.json();
                    if (bannedData.code === 200 && bannedData.data && bannedData.data.Leaderboard) {
                        bannedData.data.Leaderboard.forEach(entry => {
                            // Check if player already exists in results
                            const exists = allResults.some(e => e.PlayFabId === entry.PlayFabId);
                            if (!exists) {
                                allResults.push({
                                    ...entry,
                                    character: "BANNED",
                                    characterDisplay: "BANNED",
                                    displayName: entry.PlayFabId || "Banned Player",
                                    platform: PLATFORM,
                                    StatValue: entry.StatValue || 0,
                                    isBanned: true
                                });
                            }
                        });
                    }
                } catch (e) {
                    console.log(`⚠️ Failed to fetch ${bannedStat}:`, e.message);
                }
            }

            // ─── SORT BY LEVEL (highest first) ─────────────────────────────
            allResults.sort((a, b) => (b.StatValue || 0) - (a.StatValue || 0));

            // Add rank
            allResults.forEach((entry, idx) => {
                entry.rank = idx + 1;
            });

            saveToCache(allResults, currentCharacter);
            allEntries = allResults;
            filteredEntries = [...allResults];
            updateStats();
            renderTable();
            updateCacheStatus();
            return allResults;

        } catch (e) {
            container.innerHTML = `
                <div class="empty-state" style="color:#e94560;">
                    ⚠️ Network error: ${e.message}<br>
                    <span style="font-size:12px;color:#555;">Check your connection and try again</span>
                </div>
            `;
            return null;
        } finally {
            isRefreshing = false;
        }
    }

    async function refreshLeaderboard() {
        const btn = document.getElementById("refreshBtn");
        btn.disabled = true;
        btn.textContent = "⏳ Loading...";

        await fetchLeaderboard();

        btn.disabled = false;
        btn.textContent = "🔄 Refresh";
    }

    // ─── FILTERS ─────────────────────────────────────────────────────────────
    function setCharacter(character) {
        currentCharacter = character;
        document.querySelectorAll('[data-character]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.character === character);
        });
        filterTable();
    }

    function updateFiltersUI() {
        document.querySelectorAll('[data-character]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.character === currentCharacter);
        });
    }

    // ─── TABLE RENDER ──────────────────────────────────────────────────────
    function filterTable() {
        const charFilter = currentCharacter;

        if (charFilter === "all") {
            filteredEntries = [...allEntries];
        } else {
            filteredEntries = allEntries.filter(e => {
                return e.character === charFilter;
            });
        }
        currentPage = 1;
        renderTable();
    }

    function renderTable() {
        const container = document.getElementById('tableContainer');
        const paginationContainer = document.getElementById('paginationContainer');

        if (!filteredEntries || filteredEntries.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    ${allEntries.length === 0 ? '📦 No data loaded. Set a token and refresh.' : '🔍 No players found matching your filters'}
                </div>
            `;
            paginationContainer.style.display = 'none';
            return;
        }

        const totalPages = Math.ceil(filteredEntries.length / pageSize);
        const start = (currentPage - 1) * pageSize;
        const end = Math.min(start + pageSize, filteredEntries.length);
        const pageEntries = filteredEntries.slice(start, end);

        let html = `<table>
            <thead><tr>
                <th>#</th>
                <th>Player</th>
                <th>Character</th>
                <th>Level</th>
            </tr></thead><tbody>`;

        pageEntries.forEach((entry, idx) => {
            const rank = start + idx + 1;
            const rankClass = rank <= 3 ? `rank-${rank}` : '';
            const level = entry.StatValue || 0;
            const icon = CHARACTER_ICONS[entry.character] || 'default.png';
            const displayChar = entry.characterDisplay || entry.character || 'Unknown';
            const isBanned = entry.isBanned === true || entry.character === "BANNED";

            html += `
                <tr class="${rankClass}${isBanned ? ' banned-row' : ''}">
                    <td class="rank-number">#${rank}</td>
                    <td>
                        <div class="player-cell">
                            <img src="images/characters/${icon}" onerror="this.style.display='none'"/>
                            <span class="player-name">${entry.displayName || 'Anonymous'}</span>
                            ${isBanned ? '<span class="banned-badge">🔨 BANNED</span>' : ''}
                        </div>
                    </td>
                    <td>${isBanned ? '<span style="color:#e94560;">BANNED</span>' : displayChar}</td>
                    <td>${level}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

        if (totalPages > 1) {
            paginationContainer.style.display = 'flex';
            let pHtml = '';
            for (let i = 1; i <= totalPages; i++) {
                pHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            paginationContainer.innerHTML = pHtml;
        } else {
            paginationContainer.style.display = 'none';
        }
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
    }

    function updateStats() {
        document.getElementById('totalPlayers').textContent = allEntries.length;
        const maxLevel = allEntries.reduce((max, e) => Math.max(max, e.StatValue || 0), 0);
        document.getElementById('topLevel').textContent = maxLevel;
    }

    // ─── INIT ──────────────────────────────────────────────────────────────
    function init() {
        updateTokenStatus();

        const hasCache = loadFromCache();

        if (userToken && !hasCache) {
            refreshLeaderboard();
        }

        setInterval(() => {
            if (userToken && !isRefreshing) {
                refreshLeaderboard();
            }
        }, 300000);
    }

    init();
</script>
</body>
</html>
