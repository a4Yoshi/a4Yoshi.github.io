<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupon Grant Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f13;
      color: #e0e0e0;
      font-family: 'Segoe UI', monospace, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.3rem;
      color: #a78bfa;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 0.72rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input {
      background: #0f0f18;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 9px 12px;
      font-size: 0.85rem;
      font-family: monospace;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus { border-color: #7c3aed; }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.2s, transform 0.1s;
      margin-bottom: 20px;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .output-label {
      font-size: 0.72rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    #couponOutput {
      background: #0a0a10;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      color: #7fff7f;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 180px;
      max-height: 360px;
      overflow-y: auto;
      line-height: 1.6;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #333;
      transition: background 0.3s;
    }

    .dot.idle    { background: #444; }
    .dot.running { background: #facc15; animation: pulse 1s infinite; }
    .dot.ok      { background: #4ade80; }
    .dot.err     { background: #f87171; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .status-text { font-size: 0.75rem; color: #555; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎟️ Coupon Grant Tool</h1>
  <p class="subtitle">PlayFab · Steam Shop Currency</p>

  <div class="config-grid">
    <div class="field full">
      <label>PlayFab Title ID</label>
      <input id="titleId" type="text" placeholder="e.g. A1B2C" />
    </div>
    <div class="field full">
      <label>Session Ticket</label>
      <input id="sessionTicket" type="text" placeholder="Your X-Authorization token" />
    </div>
    <div class="field">
      <label>Store ID</label>
      <input id="storeId" type="text" value="steam_Shop_Currency" />
    </div>
    <div class="field">
      <label>Item ID</label>
      <input id="itemId" type="text" value="Currency_Bundle_PileOfCoupons" />
    </div>
    <div class="field">
      <label>Currency</label>
      <input id="currency" type="text" value="RM" />
    </div>
    <div class="field">
      <label>Provider</label>
      <input id="provider" type="text" value="Steam" />
    </div>
  </div>

  <button class="btn" id="grantBtn" onclick="grantCoupons()">
    ▶ Grant Coupons
  </button>

  <div class="output-label">Output Log</div>
  <div id="couponOutput">Waiting for execution...</div>

  <div class="status-bar">
    <div class="dot idle" id="statusDot"></div>
    <span class="status-text" id="statusText">idle</span>
  </div>
</div>

<script>
  // ─── helpers ──────────────────────────────────────────────────────────────

  function setStatus(state, msg) {
    const dot  = document.getElementById("statusDot");
    const text = document.getElementById("statusText");
    dot.className = "dot " + state;
    text.textContent = msg;
  }

  function log(msg) {
    const out = document.getElementById("couponOutput");
    out.textContent += "\n" + msg;
    out.scrollTop = out.scrollHeight;
  }

  function formatResponse(data) {
    return JSON.stringify(data, null, 2);
  }

  async function makeApiCall(endpoint, method, body) {
    const titleId = document.getElementById("titleId").value.trim();
    const ticket  = document.getElementById("sessionTicket").value.trim();

    if (!titleId) throw new Error("Title ID is required");
    if (!ticket)  throw new Error("Session Ticket is required");

    const url = `https://${titleId}.playfabapi.com/${endpoint}`;

    const res = await fetch(url, {
      method,
      headers: {
        "Content-Type":  "application/json",
        "X-Authorization": ticket
      },
      body: JSON.stringify(body)
    });

    const json = await res.json();

    // PlayFab wraps errors in { code, status, error, errorMessage }
    if (!res.ok || json.code >= 400) {
      return {
        error: json.errorMessage || json.error || `HTTP ${res.status}`
      };
    }

    return { data: json.data ?? json };
  }

  // ─── main flow ────────────────────────────────────────────────────────────

  async function grantCoupons() {
    const btn = document.getElementById("grantBtn");
    const out = document.getElementById("couponOutput");

    btn.disabled   = true;
    out.textContent = "Starting coupon grant process...";
    setStatus("running", "running");

    const storeId  = document.getElementById("storeId").value.trim();
    const itemId   = document.getElementById("itemId").value.trim();
    const currency = document.getElementById("currency").value.trim();
    const provider = document.getElementById("provider").value.trim();

    try {
      // ── Step 1: StartPurchase ────────────────────────────────────────────
      log("→ StartPurchase");
      const startData = await makeApiCall("Client/StartPurchase", "POST", {
        StoreId: storeId,
        Items: [{ ItemId: itemId, Quantity: 1 }]
      });

      if (startData.error) {
        log("✗ StartPurchase error: " + startData.error);
        setStatus("err", "failed at StartPurchase");
        return;
      }

      const orderId = startData.data?.OrderId;
      if (!orderId) {
        log("✗ StartPurchase returned no OrderId");
        setStatus("err", "no OrderId");
        return;
      }

      log("✓ OrderId: " + orderId);

      // ── Step 2: PayForPurchase ───────────────────────────────────────────
      log("→ PayForPurchase");
      const payData = await makeApiCall("Client/PayForPurchase", "POST", {
        OrderId:      orderId,
        Currency:     currency,
        ProviderName: provider
      });

      if (payData.error) {
        log("✗ PayForPurchase error: " + payData.error);
        setStatus("err", "failed at PayForPurchase");
        return;
      }

      log("✓ Payment accepted");

      // ── Step 3: ConfirmPurchase ──────────────────────────────────────────
      log("→ ConfirmPurchase");
      const confirmData = await makeApiCall("Client/ConfirmPurchase", "POST", {
        OrderId: orderId
      });

      if (confirmData.error) {
        log("✗ ConfirmPurchase error: " + confirmData.error);
        setStatus("err", "failed at ConfirmPurchase");
        return;
      }

      log("✓ Done!\n" + formatResponse(confirmData.data));
      setStatus("ok", "completed");

    } catch (err) {
      log("✗ Unexpected error: " + err.message);
      setStatus("err", "exception thrown");
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
